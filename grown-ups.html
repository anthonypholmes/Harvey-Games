<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="js/first-paint.js"></script><!-- the background at once, then a fade: no blank flash between pages -->
<script src="js/meadow-look.js"></script><!-- the meadow look: its on/off switch and where its places link -->
<title>Grown-ups</title>
<!-- Install as an app (PWA): works offline from the home screen -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FDFBF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meadow Club">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>
  // Inside the App Store app (Capacitor) the files are already on the iPad, so no service worker.
  window.MEADOW_IN_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if (!window.MEADOW_IN_APP && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
<link href="fonts/fonts.css" rel="stylesheet">
</head>
<body>
<!-- The grown-ups area for the whole game (24 November 2026): settings, players, each game's progress, and the bones and
     prizes, in one place. The Clubhouse, the maps and the Bone Shop all open it; it goes back to where it was opened from
     (?from=club, maths or words). Every world is loaded (as on Bonnie's Walk) so both games' progress is here, but
     nothing of the games is started: no map, no hello from Bonnie. It saves only to meadow-save-v1. -->
<script src="js/app-storage.js"></script>
<script src="bonnie-voice.js"></script>
<script src="meadow-backup.js"></script>
<script src="js/meadow-core.js"></script>
<!-- every English world, then the maths kit and the maths worlds (keep in step with the two game pages) -->
<script src="worlds/y2-english-phonics.js"></script>
<script src="worlds/y2-english-tricky-words.js"></script>
<script src="worlds/y2-english-sentences.js"></script>
<script src="worlds/y2-english-stories.js"></script>
<script src="worlds/y2-maths-kit.js"></script>
<script src="worlds/y2-maths-partitioning.js"></script>
<script src="worlds/y2-maths-number-bonds.js"></script>
<script src="worlds/y2-maths-number-lines.js"></script>
<script src="worlds/y2-maths-arrays.js"></script>
<script src="worlds/y2-maths-sharing.js"></script>
<script src="worlds/y2-maths-sharing-fractions.js"></script>
<script src="worlds/y2-maths-money.js"></script>
<script src="worlds/y2-maths-time.js"></script>
<script src="worlds/y2-maths-captains-cove.js"></script>
<script>
Meadow.startGame({ subject: 'grownups', title: 'Grown-ups', icon: '', homeHref: 'index.html', grownUpsPage: true, needName: false, greets: [] });
</script>
</body>
</html>
