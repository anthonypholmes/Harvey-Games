<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meadow Words</title>
<!-- Install as an app (PWA): works offline from the home screen -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FDFBF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meadow Club">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Meadow Words — Year 2 (KS1) English
   Cozy storybook palette. Cards are always #FDFBF7 parchment.
   ========================================================= */
:root{
  --card:#FDFBF7; --card-edge:#EADFCB; --ink:#4A3B2C; --ink-soft:#7A6A58;
  --accent:#E07A3F; --accent-dark:#B85C26; --leaf:#6BA368; --leaf-dark:#4C7E4A;
  --sky:#BFE3F0; --wood:#D9A86C; --wood-light:#EDC994; --wood-dark:#9A6A3A;
  --gold:#F2C14E; --berry:#D9596B; --berry-dark:#A93E4F; --line:#E8DCC8;
  --bg1:#F6EBD3; --bg2:#E7D9B8; --on-bg:#4A3B2C;
  --shadow:0 6px 0 rgba(74,59,44,.12), 0 14px 28px rgba(74,59,44,.10);
  --radius:22px;
  --fur:#9a6440; --fur-dk:#74472a; --fur-lt:#c99568;
  --font-ui:'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --font-read:'Andika', 'Comic Sans MS', 'Trebuchet MS', sans-serif; /* Andika: designed for early readers */
}
body[data-theme="sunset"]{--bg1:#FFE3D0;--bg2:#F7B9A0}
body[data-theme="sunset"]{background:radial-gradient(900px 600px at 85% 105%,rgba(255,190,110,.55),transparent 65%),radial-gradient(1000px 650px at 0% 0%,rgba(247,150,140,.35),transparent 60%),radial-gradient(800px 600px at 100% 0%,rgba(170,130,200,.28),transparent 60%),#FFF1E6;background-attachment:fixed}
body[data-theme="night"]{--on-bg:#F3EEDF;--accent:#B58BE0;--accent-dark:#8A62B8;background:radial-gradient(700px 500px at 85% 0%,rgba(120,130,200,.35),transparent 60%),radial-gradient(900px 700px at 0% 100%,rgba(60,40,110,.45),transparent 60%),#1C2140;background-attachment:fixed}
body[data-theme="snow"]{--accent:#2F8FB0;--accent-dark:#1F6A85;background:radial-gradient(900px 600px at 10% 0%,rgba(180,212,240,.6),transparent 60%),radial-gradient(800px 600px at 100% 100%,rgba(255,255,255,.9),transparent 60%),#EEF5FB;background-attachment:fixed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--font-ui); color:var(--ink);
  background:radial-gradient(1200px 600px at 20% -10%, rgba(255,255,255,.55), transparent 60%),
             linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed; min-height:100%; overflow-x:hidden;
  user-select:none; -webkit-user-select:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:12px 16px 120px;min-height:100vh}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.hud .title{font-weight:700;font-size:1.25rem;color:var(--on-bg);display:flex;align-items:center;gap:8px;margin-right:auto;cursor:pointer}
.chip{background:var(--card);border:2px solid var(--card-edge);border-radius:999px;padding:6px 14px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(74,59,44,.12)}
.chip.bones{font-size:1.15rem}
.chip.bones.bump{animation:bump .45s}
.chip.streak{transition:all .25s}
.chip.streak.hot{background:linear-gradient(180deg,#FFE7A8,#F2C14E);border-color:#D9A22F}
.chip.mult{background:var(--berry);color:#fff;border-color:var(--berry-dark);display:none}
.chip.mult.on{display:flex;animation:pulse 1.2s infinite}
.icon-btn{text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--card-edge);border-radius:14px;padding:6px 12px;font-weight:600;box-shadow:0 3px 0 rgba(74,59,44,.12)}
.icon-btn:active{transform:translateY(2px);box-shadow:none}

/* ---------- Cards & buttons ---------- */
.card{background:var(--card);border:2px solid var(--card-edge);border-radius:var(--radius);box-shadow:var(--shadow);position:relative}
.btn{background:var(--accent);color:#fff;font-weight:600;font-size:1.1rem;padding:12px 22px;border-radius:16px;box-shadow:0 5px 0 var(--accent-dark);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-dark)}
.btn.green{background:var(--leaf);box-shadow:0 5px 0 var(--leaf-dark)}
.btn.berry{background:var(--berry);box-shadow:0 5px 0 var(--berry-dark)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--card-edge);box-shadow:0 4px 0 var(--card-edge)}
.btn.small{font-size:.95rem;padding:8px 14px;border-radius:12px}
.btn:disabled{opacity:.45;pointer-events:none}
h1,h2,h3{margin:0;font-weight:700}
.on-bg{color:var(--on-bg)}

/* ---------- Home ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px 22px;margin-bottom:18px}
.hero h1{font-size:clamp(1.6rem,4vw,2.4rem)}
.hero p{margin:6px 0 0;font-family:var(--font-read);font-size:1.15rem;color:var(--ink-soft)}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.world-card{padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s;overflow:hidden}
.world-card:hover{transform:translateY(-3px) rotate(-.4deg)}
.world-card:active{transform:scale(.98)}
.world-card .wicon{font-size:3rem;line-height:1;width:72px;height:72px;border-radius:20px;display:grid;place-items:center;margin-bottom:4px}
.world-card h3{font-size:1.3rem}
.world-card .sub{font-family:var(--font-read);color:var(--ink-soft)}
.world-card .wstars{font-weight:600;color:var(--wood-dark)}
.world-card .ribbon{position:absolute;top:14px;right:-34px;transform:rotate(35deg);background:var(--gold);padding:3px 40px;font-size:.75rem;font-weight:700}
.home-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}

/* ---------- Level map ---------- */
.map{padding:20px;margin-top:6px}
.map-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.map-head h2{font-size:1.6rem}
.path{position:relative;display:flex;flex-direction:column;gap:14px;padding:10px 0}
.stone{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:20px;background:#F5EEDF;border:2px dashed var(--card-edge);width:min(560px,100%);text-align:left;transition:transform .15s}
.stone:nth-child(even){margin-left:auto}
.stone .num{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;font-weight:700;color:#fff;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.stone .lt{font-weight:600;font-size:1.1rem}
.stone .ls{font-size:1.2rem;letter-spacing:2px}
.stone.locked{opacity:.55;filter:grayscale(.6)}
.stone:not(.locked):hover{transform:scale(1.02)}

/* ---------- Game frame ---------- */
.game-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.game-top .gt{font-weight:700;color:var(--on-bg);font-size:1.1rem}
.pips{display:flex;gap:6px;margin-left:auto}
.pip{width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--card-edge)}
.pip.done{background:var(--leaf);border-color:var(--leaf-dark)}
.pip.now{background:var(--gold);border-color:#C99A2E;transform:scale(1.25)}
.game-main{display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
.play-card{padding:22px;min-height:440px}
.dock{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
.bubble{background:#fff;border:2px solid var(--card-edge);border-radius:18px;padding:12px 14px;font-family:var(--font-read);font-size:1.08rem;line-height:1.35;position:relative;width:100%;min-height:64px}
.bubble::after{content:"";position:absolute;bottom:-11px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble::before{content:"";position:absolute;bottom:-14px;left:50%;margin-left:-12px;border:12px solid transparent;border-top-color:var(--card-edge);border-bottom:0}
.bubble.pop{animation:pop .35s}
.bubble b{color:var(--accent-dark)}
.ladder{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--ink-soft)}
.ladder .rung{width:22px;height:22px;border-radius:50%;background:#F1E8D6;display:grid;place-items:center;font-size:.75rem}
.ladder .rung.on{background:var(--gold)}

/* ---------- Bonnie ---------- */
.bonnie{position:relative;width:140px;height:140px;cursor:pointer;flex:none;transition:transform .2s}
.bonnie svg{width:100%;height:100%;overflow:visible}
.bonnie.small{width:90px;height:90px;font-size:.65em}
.bonnie.big{width:170px;height:170px;font-size:1.2em}
.bonnie .eyes{transform-origin:60px 52px;animation:blink 5s infinite}
.bonnie .tail{transform-origin:86px 100px;animation:wag 1.4s ease-in-out infinite}
.bonnie.wiggle{animation:wiggle .6s}
.bonnie.happy{animation:hop .55s}
.bonnie.giggle{animation:giggle .9s}
.bonnie .ear-l{transform-origin:33px 42px;transition:transform .3s}
.bonnie .ear-r{transform-origin:87px 42px;transition:transform .3s}
.bonnie.giggle .ear-l{transform:rotate(18deg)}
.bonnie.giggle .ear-r{transform:rotate(-18deg)}
.heart{position:fixed;pointer-events:none;z-index:60;font-size:1.6rem;animation:floatUp 1.2s ease-out forwards}

/* ---------- Phonics ---------- */
.clue{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.clue-pic{font-size:5rem;line-height:1;background:#F4ECDC;border-radius:24px;width:120px;height:120px;display:grid;place-items:center;animation:floaty 3s ease-in-out infinite}
.clue-text{font-family:var(--font-read);font-size:1.35rem;max-width:340px;text-align:center}
.word-wrap{display:flex;justify-content:center;margin:12px 0 6px}
.word-row{position:relative;display:flex;gap:10px;align-items:flex-start;padding-bottom:30px}
.slot-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.slot{min-width:74px;height:84px;border-radius:16px;border:3px dashed #CDBB9C;background:#F7F0E2;display:grid;place-items:center;transition:all .15s}
.slot.wide{min-width:104px}
.slot.drop-hover{background:#FFF2C9;border-color:var(--gold);transform:scale(1.06)}
.slot.locked{border-style:solid;border-color:var(--leaf);background:#E8F3DF}
.slot.bad{animation:shake .45s;border-color:var(--berry);background:#FBE3E6}
.slot.glow{box-shadow:0 0 0 5px rgba(242,193,78,.6)}
.sb{width:18px;height:18px;border-radius:50%;background:var(--ink);opacity:.8;transition:transform .1s}
.sb.dash{width:46px;border-radius:9px;height:12px;margin-top:3px}
.sb:active,.sb.say{transform:scale(1.35);background:var(--accent);opacity:1}
.arc{position:absolute;bottom:4px;height:22px;border:5px solid var(--ink);border-top:none;border-radius:0 0 40px 40px;opacity:.8;pointer-events:none}
.bank{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:16px;border-radius:20px;background:repeating-linear-gradient(90deg,#EAD9BA 0 22px,#E3D0AD 22px 44px);min-height:110px;margin-top:10px;border:3px solid #D5BE95}
.bank.drop-hover{outline:4px solid var(--gold)}
.tile{font-family:var(--font-read);font-weight:700;font-size:2.4rem;min-width:70px;height:78px;padding:0 12px;border-radius:14px;display:grid;place-items:center;color:#3B2A1A;
  background:linear-gradient(180deg,var(--wood-light),var(--wood));border-bottom:6px solid var(--wood-dark);box-shadow:0 4px 8px rgba(74,59,44,.25), inset 0 2px 0 rgba(255,255,255,.5);
  touch-action:none;cursor:grab;position:relative}
.tile::after{content:"";position:absolute;inset:6px;border-radius:10px;background:repeating-linear-gradient(100deg,transparent 0 9px,rgba(154,106,58,.07) 9px 11px);pointer-events:none}
.tile.in-slot{height:76px;min-width:66px}
.tile.dragging{opacity:.3}
.tile.snap{animation:snap .4s cubic-bezier(.3,1.6,.5,1)}
.drag-ghost{position:fixed!important;z-index:100;pointer-events:none;transform:scale(1.12) rotate(-4deg);box-shadow:0 18px 30px rgba(0,0,0,.25)!important;margin:0!important}
.row-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- Tricky trail ---------- */
.trail{display:flex;align-items:flex-end;gap:0;justify-content:space-between;margin:4px 0 18px;padding:10px 6px 4px;background:linear-gradient(180deg,transparent 60%,#D9EBC4 60%);border-radius:18px;position:relative}
.step{width:44px;height:20px;background:#CDBB9C;border-radius:50%;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.step.done{background:var(--leaf)}
.step .pup{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:56px;height:56px;transition:all .5s}
.trail .goal{font-size:2rem}
.tricky-sentence{font-family:var(--font-read);font-size:clamp(1.5rem,3.5vw,2.1rem);text-align:center;margin:10px 0 20px;line-height:1.5}
.gap{display:inline-block;min-width:120px;border-bottom:4px dashed var(--accent);margin:0 6px;color:var(--leaf-dark);font-weight:700}
.signs{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.sign{position:relative;z-index:0;padding:0 0 46px;transition:transform .2s}
.sign .board{font-family:var(--font-read);font-weight:700;font-size:clamp(1.5rem,3.4vw,2rem);background:linear-gradient(180deg,var(--wood-light),var(--wood));border-bottom:6px solid var(--wood-dark);padding:14px 26px;border-radius:12px 34px 34px 12px;box-shadow:0 6px 10px rgba(74,59,44,.25);color:#3B2A1A;min-width:150px;text-align:center}
.sign::after{content:"";position:absolute;left:24px;bottom:0;width:14px;height:52px;background:var(--wood-dark);border-radius:4px;z-index:-1}
.sign:hover{transform:rotate(-2deg) translateY(-3px)}
.sign.wrong{animation:wobble .6s;opacity:.35;pointer-events:none}
.sign.right .board{background:linear-gradient(180deg,#BFE3A8,var(--leaf));border-color:var(--leaf-dark)}
.sign.glow .board{box-shadow:0 0 0 6px rgba(242,193,78,.7)}

/* ---------- Sentence meadow ---------- */
.s-line{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:96px;padding:16px;border-radius:20px;background:#F7F0E2;border:3px dashed #CDBB9C;margin:14px 0}
.s-line.drop-hover{border-color:var(--gold);background:#FFF6DA}
.s-line .ph{color:var(--ink-soft);font-family:var(--font-read)}
.wchip{font-family:var(--font-read);font-size:1.7rem;font-weight:700;padding:10px 16px;border-radius:14px;background:#fff;border:2px solid var(--card-edge);border-bottom:5px solid #D8C7A8;touch-action:none;cursor:grab;position:relative;transition:background .2s}
.wchip.placed{background:#FFFDF6}
.wchip.capped .first{color:var(--accent-dark);text-decoration:underline wavy var(--gold) 2px;text-underline-offset:5px}
.wchip.glow{box-shadow:0 0 0 5px rgba(242,193,78,.7)}
.wchip.snap{animation:snap .4s cubic-bezier(.3,1.6,.5,1)}
.wchip.dragging{opacity:.3}
.aa{position:absolute;top:-14px;right:-10px;width:30px;height:30px;border-radius:50%;background:var(--gold);font-size:.8rem;font-weight:700;font-family:var(--font-ui);display:grid;place-items:center;box-shadow:0 2px 0 #C99A2E;color:var(--ink)}
.p-slot{width:62px;height:72px;border-radius:50%;border:3px dashed var(--accent);display:grid;place-items:center;font-size:2.6rem;font-weight:700;font-family:var(--font-read);background:#FFF5EC}
.p-slot.filled{border-style:solid;background:#FFE6D2}
.p-slot.drop-hover{transform:scale(1.15);background:#FFF2C9}
.badges{display:flex;gap:14px;justify-content:center;margin-top:10px}
.badge{width:72px;height:72px;border-radius:50%;font-size:2.6rem;font-weight:700;font-family:var(--font-read);color:#fff;display:grid;place-items:center;touch-action:none;cursor:grab;box-shadow:0 5px 0 rgba(0,0,0,.2);position:relative}
.badge small{position:absolute;bottom:-22px;font-size:.72rem;color:var(--ink-soft);font-family:var(--font-ui);white-space:nowrap}
.badge.off{opacity:.25;pointer-events:none}
.badge.glow{box-shadow:0 0 0 6px rgba(242,193,78,.8)}
.s-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border-radius:20px;background:#EFE5D0;min-height:80px}
.s-bank.drop-hover{outline:4px solid var(--gold)}
.mode-tip{text-align:center;font-family:var(--font-read);font-size:1.2rem;color:var(--ink-soft)}

/* ---------- Story nook ---------- */
.story{font-family:var(--font-read);font-size:clamp(1.35rem,3vw,1.75rem);line-height:1.7;padding:18px 22px;background:#FFFDF8;border-radius:18px;border:2px solid var(--line);position:relative}
.story::before{content:"📖";position:absolute;top:-18px;left:-10px;font-size:2rem;transform:rotate(-12deg)}
.story .w{padding:2px 3px;border-radius:6px;transition:background .15s}
.story .w.hl{background:var(--gold)}
.story .w.ev{background:#CFE8BE;box-shadow:0 0 0 2px var(--leaf)}
.story .blank{display:inline-block;min-width:90px;border-bottom:4px dashed var(--accent);text-align:center;color:var(--leaf-dark);font-weight:700}
.question{font-family:var(--font-read);font-size:1.45rem;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.opt{font-family:var(--font-read);font-size:1.4rem;font-weight:700;padding:16px;border-radius:40px;background:linear-gradient(180deg,#FFF,#F3EADA);border:3px solid var(--card-edge);border-bottom-width:7px;transition:transform .12s}
.opt:hover{transform:translateY(-2px)}
.opt.wrong{animation:shake .45s;opacity:.35;pointer-events:none}
.opt.right{background:linear-gradient(180deg,#D8F0C6,#A9D58C);border-color:var(--leaf-dark)}
.opt.glow{box-shadow:0 0 0 6px rgba(242,193,78,.8)}

/* ---------- Shop & parents ---------- */
.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:14px;background:var(--card);border:2px solid var(--card-edge);font-weight:600}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent-dark)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.item{padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.item .ie{font-size:3rem;line-height:1.1;min-height:3.3rem}
.item .hatprev{width:84px;height:84px}.item .hatprev svg{width:100%;height:100%;overflow:visible}
.item .swatch{width:70px;height:50px;border-radius:12px;border:2px solid var(--card-edge)}
.item .cost{font-weight:700;color:var(--wood-dark)}
.parent{padding:22px;display:flex;flex-direction:column;gap:18px}
.parent section{border-top:2px dashed var(--line);padding-top:14px}
.parent label{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0;font-weight:500}
.parent input[type=text],.parent input[type=number]{font-family:inherit;font-size:1rem;padding:8px 10px;border-radius:10px;border:2px solid var(--card-edge);background:#fff;color:var(--ink)}
.prize-row{display:grid;grid-template-columns:40px 1fr 90px auto;gap:8px;align-items:center;margin:6px 0}
.prize-row input{width:100%}
.redeem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.note{font-size:.9rem;color:var(--ink-soft)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(58,45,30,.45);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{max-width:460px;width:100%;padding:26px;text-align:center;animation:pop .35s}
.modal h2{font-size:1.7rem;margin-bottom:6px}
.modal p{font-family:var(--font-read);font-size:1.15rem}
.modal .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.modal input{font-size:1.5rem;width:140px;text-align:center;padding:8px;border-radius:12px;border:2px solid var(--card-edge);font-family:inherit}
.stars-big{font-size:3rem;letter-spacing:6px}
.stars-big span{display:inline-block;animation:starIn .5s both}

/* ---------- FX ---------- */
.fly{position:fixed;z-index:90;pointer-events:none;font-size:1.8rem;transition:transform .8s cubic-bezier(.5,-0.3,.6,1),opacity .8s}
.confetti{position:fixed;top:-40px;z-index:85;pointer-events:none;font-size:1.6rem;animation:fall linear forwards}
.banner{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:95;background:linear-gradient(180deg,#FFE48A,#F2C14E);border:3px solid #C99A2E;border-radius:20px;padding:12px 22px;font-weight:700;font-size:1.3rem;box-shadow:var(--shadow);animation:bannerIn 2.4s forwards;pointer-events:none;text-align:center;white-space:nowrap}
.shake{animation:screenShake .4s}
.float-plus{position:fixed;z-index:92;pointer-events:none;font-weight:700;font-size:1.5rem;color:var(--leaf-dark);animation:floatUp 1s ease-out forwards;text-shadow:0 2px 0 #fff}

/* ---------- Meadow decorations ---------- */
.meadow{position:fixed;left:0;right:0;bottom:0;height:90px;z-index:1;pointer-events:none;
  background:
   radial-gradient(14px 10px at 8% 30%, #F7D96B 40%, transparent 42%),
   radial-gradient(12px 9px at 27% 45%, #fff 40%, transparent 42%),
   radial-gradient(14px 10px at 61% 35%, #F29BB0 40%, transparent 42%),
   radial-gradient(12px 9px at 83% 40%, #fff 40%, transparent 42%),
   radial-gradient(14px 10px at 94% 25%, #F7D96B 40%, transparent 42%),
   linear-gradient(180deg,transparent 0 20%,#9CCB7C 20% 100%);
  border-top-left-radius:50% 30px;border-top-right-radius:50% 30px}
.butterfly{position:fixed;z-index:1;font-size:1.8rem;pointer-events:none;animation:flutter 18s linear infinite}
.butterfly span{display:inline-block;animation:flap .35s ease-in-out infinite alternate}
.frog{position:fixed;bottom:32px;left:-60px;z-index:4;font-size:2.4rem;cursor:pointer;animation:frogTrip 26s linear infinite}
.frog span{display:inline-block;animation:hopY 1.3s ease-in-out infinite}
.frog.boing span{animation:bigHop .7s}

/* ---------- Keyframes ---------- */
@keyframes bump{50%{transform:scale(1.25)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes pop{0%{transform:scale(.85);opacity:.4}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(18deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) scale(1.04)}}
@keyframes giggle{0%,100%{transform:rotate(0)}10%,50%{transform:rotate(-10deg) scale(1.05)}30%,70%{transform:rotate(10deg) scale(1.05)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
@keyframes floaty{50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(8deg)}}
@keyframes snap{0%{transform:scale(1.3) translateY(-10px)}60%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}80%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes bannerIn{0%{transform:translate(-50%,-30px) scale(.6);opacity:0}12%{transform:translate(-50%,0) scale(1.08);opacity:1}20%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
@keyframes screenShake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
@keyframes flutter{0%{transform:translate(-10vw,60vh)}25%{transform:translate(30vw,20vh)}50%{transform:translate(60vw,45vh)}75%{transform:translate(85vw,10vh)}100%{transform:translate(110vw,40vh)}}
@keyframes flap{to{transform:scaleX(.55)}}
@keyframes frogTrip{0%{left:-60px}100%{left:calc(100vw + 60px)}}
@keyframes hopY{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes bigHop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-70px) rotate(-20deg)}}

@media (max-width:820px){
  .game-main{grid-template-columns:1fr}
  .dock{position:static;flex-direction:row;flex-wrap:wrap;justify-content:center;order:-1;padding:10px}
  .dock .bonnie{width:84px;height:84px;font-size:.6em}
  .dock .bubble{flex:1;min-width:180px;width:auto}
  .dock .bubble::after,.dock .bubble::before{display:none}
  .play-card{padding:16px;min-height:0}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
}
@media (max-width:520px){
  .tile{font-size:1.8rem;min-width:54px;height:62px}
  .slot{min-width:56px;height:68px}.slot.wide{min-width:80px}
  .tile.in-slot{min-width:50px;height:60px}
  .word-row{gap:6px}
  .wchip{font-size:1.3rem;padding:8px 12px}
  .prize-row{grid-template-columns:32px 1fr 70px auto}
  .clue-pic{width:96px;height:96px;font-size:4rem}
  .sign .board{min-width:110px;padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .butterfly,.frog{display:none}
}

<script>
/* =========================================================

const CONFIG = {

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =========================================================

  { id: 'snow',   name: 'Winter Snow',          cost: 400, sw: 'linear-gradient(#EEF5FB,#B4D4F0)' },
];
const prizeEmoji = t => { t = t.toLowerCase();
  return /snack/.test(t) ? '🍪' : /dj|music/.test(t) ? '🎶' : /screen|gaming|tablet/.test(t) ? '📺' : /dessert|pudding/.test(t) ? '🍨'
    : /bed|stay up|late/.test(t) ? '🌙' : /shop|treat/.test(t) ? '🍬' : /movie|film/.test(t) ? '🎬' : /bowling/.test(t) ? '🎳'
    : /build|lego/.test(t) ? '🧱' : /toy|card/.test(t) ? '🧸' : /outing|trip|park/.test(t) ? '🏞️' : /dinner/.test(t) ? '🍕' : '🎁'; };
const WORDS_DEFAULTS = { voiceRate: 0.9, unlockAll: false };
const todayGB = () => new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
function readRaw() { try { return JSON.parse(localStorage.getItem(CONFIG.SHARED_KEY) || 'null') || {}; } catch (e) { return {}; } }
/* Reads the Meadow Maths save into the shape this game uses. */
function loadShared() {
  const raw = readRaw(), owned = raw.owned || {};
  return {
    childName: raw.name || 'friend', nameSet: !!raw.name, // the name is set on the Clubhouse page
    bones: Math.max(0, Math.floor(+raw.bones || 0)),
    hat: raw.hat || 'none', theme: raw.theme || 'day',
    ownedHats: ['none', ...(owned.hats || [])], ownedThemes: owned.themes || ['day'],
    prizes: (Array.isArray(raw.rewards) ? raw.rewards : STARTER_PRIZES).map(r => ({ ...r, emoji: prizeEmoji(r.title || '') })),
    prizesSaved: Array.isArray(raw.rewards), prizesDirty: false,
    redemptions: Array.isArray(raw.redeemed) ? raw.redeemed : [],
    settings: { sfx: raw.sound !== false, ...WORDS_DEFAULTS, ...(raw.words || {}) },
  };
}
/* Writes back only the shared fields, keeping everything else Meadow Maths has saved. */
function saveShared() {
  const raw = readRaw();
  raw.bones = S.bones;
  raw.hat = S.hat === 'none' ? null : S.hat;
  raw.theme = S.theme;
  raw.owned = Object.assign({}, raw.owned, { hats: S.ownedHats.filter(h => h !== 'none'), themes: S.ownedThemes });
  if (S.prizesSaved || S.prizesDirty) raw.rewards = S.prizes.map(({ id, cost, title, desc }) => ({ id, cost, title, desc: desc || '' }));
  raw.redeemed = S.redemptions;
  raw.sound = S.settings.sfx;
  raw.words = { voiceRate: S.settings.voiceRate, unlockAll: S.settings.unlockAll };
  try { localStorage.setItem(CONFIG.SHARED_KEY, JSON.stringify(raw)); } catch (e) {}
}
/* Always re-read before changing, so a maths tab open at the same time never loses bones. */
function mutate(fn) { S = loadShared(); fn(S); saveShared(); renderHud(); }
let S = loadShared();

function loadProgress() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(CONFIG.PROGRESS_KEY) || 'null'); } catch (e) {}
  p = p || {};
  for (let w = 0; w < 4; w++) if (!p['w' + w]) p['w' + w] = { stars: [0, 0, 0, 0, 0] };
  return p;
}
function saveProgress() { try { localStorage.setItem(CONFIG.PROGRESS_KEY, JSON.stringify(P)); } catch (e) {} }
let P = loadProgress();

window.addEventListener('storage', e => { if (e.key === CONFIG.SHARED_KEY) { S = loadShared(); renderHud(); applyTheme(); } });

/* =========================================================
   SOUND EFFECTS (Web Audio — no files needed)
   ========================================================= */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }

  if (!S.settings.sfx) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();

  fanfare: () => [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', .16, 0, i * .12)),
  giggle: () => [800, 1000, 850, 1100, 900].forEach((f, i) => tone(f, .07, 'sine', .12, 120, i * .08)),
  ribbit: () => { tone(180, .08, 'sawtooth', .08, 60); tone(160, .12, 'sawtooth', .08, 80, .1); },

/* =========================================================

   ========================================================= */
Object.assign(BonnieVoice, { getName: () => S.childName, getAudio: ac, getRate: () => S.settings.voiceRate || .9 });
const say = (text, opts) => BonnieVoice.say(text, opts);
const hush = () => BonnieVoice.hush();
/* Phoneme approximations for sound buttons. Long vowels use letter names (A = "ay"). */
const PH = { a: 'ah', b: 'buh', c: 'kuh', d: 'duh', e: 'eh', f: 'fff', g: 'guh', h: 'huh', i: 'ih', j: 'juh', k: 'kuh', l: 'lll', m: 'mmm', n: 'nnn', o: 'o', p: 'puh', q: 'kwuh', r: 'rrr', s: 'sss', t: 'tuh', u: 'uh', v: 'vvv', w: 'wuh', x: 'ks', y: 'yuh', z: 'zzz',
  sh: 'shh', ch: 'chuh', th: 'thh', ng: 'ng', ck: 'kuh', sc: 'sss', ai: 'A', ay: 'A', ee: 'E', ea: 'E', igh: 'I', ie: 'I', oa: 'O' };
const LONG = { a: 'A', e: 'E', i: 'I', o: 'O', u: 'U' };

/* =========================================================
   CURRICULUM DATA
   ========================================================= */
const ph = (word, emoji, parts, clue, extra) => ({ word, emoji, parts, clue, extra });
const PHONICS = [
  { title: 'a-e  (cake, snake)', split: true, pool: ['i', 'o', 'u', 'e', 't', 'b'], tip: "Remember, when 'e' sits at the end, it jumps over a letter and makes the vowel say its name! a-e says 'ay'.", items: [
    ph('cake', '🎂', ['c', 'a', 'k', 'e'], 'A yummy birthday ___!'), ph('snake', '🐍', ['s', 'n', 'a', 'k', 'e'], 'A long, wiggly ___.'),

    ph('kite', '🪁', ['k', 'i', 't', 'e'], 'Fly a ___ in the wind.'), ph('bike', '🚲', ['b', 'i', 'k', 'e'], 'Ride my ___ to the park.'),
    ph('five', '5️⃣', ['f', 'i', 'v', 'e'], 'One, two, three, four, ___!'), ph('smile', '😊', ['s', 'm', 'i', 'l', 'e'], 'Show me a big ___!'),

    ph('nose', '👃', ['n', 'o', 's', 'e'], 'Bonnie sniffs with her ___.'), ph('home', '🏠', ['h', 'o', 'm', 'e'], 'Time to go ___.'),
    ph('globe', '🌍', ['g', 'l', 'o', 'b', 'e'], 'Spin the ___ to see the world.')] },
  { title: 'u-e & e-e  (cube, these)', split: true, pool: ['a', 'o', 'i', 'ee', 's', 'd'], tip: "When 'e' is at the end, u-e says 'you' and e-e says 'ee'. The 'e' at the end is a quiet helper!", items: [
    ph('cube', '🧊', ['c', 'u', 'b', 'e'], 'An ice ___ in my drink.'), ph('tube', '🚇', ['t', 'u', 'b', 'e'], 'Ride the London ___!'),
    ph('cute', '🐶', ['c', 'u', 't', 'e'], 'Bonnie is so ___!'), ph('mute', '🔇', ['m', 'u', 't', 'e'], 'Press ___ to stop the sound.'),
    ph('these', '👟', ['th', 'e', 's', 'e'], 'I like ___ shoes!'), ph('theme', '🏴‍☠️', ['th', 'e', 'm', 'e'], 'The party ___ is pirates!'),

}

/* =========================================================
   DRAG + TAP (pointer events: mouse, touch & pen)
   ========================================================= */
function draggable(el, { onTap, onDrop, dropSel }) {
  el.addEventListener('pointerdown', e => {
    if (e.button > 0 || e.target.closest('.aa')) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY, r = el.getBoundingClientRect(), offX = sx - r.left, offY = sy - r.top;
    let ghost = null, hover = null;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
        ghost = el.cloneNode(true); ghost.classList.add('drag-ghost'); ghost.classList.remove('snap', 'glow');
        ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px'; document.body.appendChild(ghost);
        el.classList.add('dragging'); sfx.pick();
      }
      if (ghost) {
        ghost.style.left = (ev.clientX - offX) + 'px'; ghost.style.top = (ev.clientY - offY) + 'px';
        const under = document.elementFromPoint(ev.clientX, ev.clientY); const t = under && under.closest(dropSel);
        if (t !== hover) { hover && hover.classList.remove('drop-hover'); hover = t; hover && hover.classList.add('drop-hover'); }
      }
    };
    const up = ev => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      hover && hover.classList.remove('drop-hover');
      if (ghost) {
        ghost.remove(); el.classList.remove('dragging');
        if (ev.type === 'pointerup') { const under = document.elementFromPoint(ev.clientX, ev.clientY); onDrop && onDrop(under && under.closest(dropSel)); }
      } else if (ev.type === 'pointerup') onTap && onTap();
    };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}

/* =========================================================
   GAME ENGINE (shared by all worlds)
   ========================================================= */
const PRAISE = ["Pawsome, {N}!", "Woof! Brilliant!", "You're a word wizard, {N}!", "Tail-waggingly good!", "Super job, {N}!", "Bone-tastic!", "Wow! Clever clogs!"];
const HINT_TIERS = ['Sniff Clue', 'Scout Tip!', 'Paw Help', 'Watch Me!'];
const FINISH_MSGS = { 3: "WOW, {N}! Three stars! You're a superstar!", 2: "Brilliant work, {N}! Two shiny stars!", 1: "You did it, {N}! Every try makes you stronger!" };
const SENT_PROMPTS = { caps: 'Tap the words that need a capital letter!', punct: 'Which punctuation mark goes at the end?', order: 'Drag the words into the right order, then add the end mark!', all: 'Order the words, tap Aa for capitals, then add the end mark!' };
const OOPS = ["Nearly! Have another sniff.", "Ooh, so close! Try again.", "That's okay — mistakes help our brains grow!", "Not quite. You can do it, {N}!"];

function startLevel(w, l) {
  const L = WORLDS[w].levels[l];
  G = { w, l, L, items: shuffle(L.items).slice(0, CONFIG.ITEMS_PER_LEVEL), i: 0, mistakes: 0, helped: 0, earned: 0 };
  show(`
    <div class="game-top">
      <button class="icon-btn" id="back">← Map</button>
      <div class="gt">${WORLDS[w].icon} ${WORLDS[w].name} · Level ${l + 1}</div>
      <div class="pips" id="pips"></div>
    </div>
    <div class="game-main">
      <section class="card play-card" id="area"></section>
      <aside class="card dock">
        <div class="bubble" id="bubble"></div>
        ${bonnieHTML('', 'gameBonnie')}
        <button class="btn small green" id="askBtn">🐾 Ask Bonnie</button>
        <div class="ladder" title="Hint ladder"><span>Hints</span>${[1, 2, 3, 4].map(i => `<span class="rung" data-r="${i}">${i}</span>`).join('')}</div>
      </aside>
    </div>`);
  $('#back').onclick = () => worldScreen(w);
  $('#gameBonnie').onclick = askBonnie;
  $('#askBtn').onclick = askBonnie;
  nextItem();
}
function renderPips() {
  $('#pips').innerHTML = G.items.map((_, i) => `<span class="pip ${i < G.i ? 'done' : i === G.i ? 'now' : ''}"></span>`).join('');
  $$('.rung').forEach(r => r.classList.toggle('on', +r.dataset.r <= G.tier));
}
function bubble(text, speak = true) {
  const b = $('#bubble'); if (!b) return;
  b.innerHTML = text; animate(b, 'pop', 350);
  if (speak) say(b.textContent);
}
/* Run fn after ms, once Bonnie has finished talking, if the same question is still on screen. */
function later(fn, ms) { const g = G, i = G && G.i; setTimeout(() => BonnieVoice.whenQuiet(() => { if (G && G === g && G.i === i && !G.busy) fn(); }), ms); }
function nextItem() {
  if (G.i >= G.items.length) return finishLevel();
  Object.assign(G, { tier: 0, hintBone: false, helpedNow: false, busy: false, hints: [] });
  renderPips();
  const item = G.items[G.i];
  ({ phonics: playPhonics, tricky: playTricky, sentence: playSentence, story: playStory })[WORLDS[G.w].key](item);
}
/* 4-tier hint ladder. Tier 1 nudge → 2 Scout Tip → 3 partial help → 4 Bonnie shows you. */
function askBonnie() {
  if (!G || G.busy) return;
  const bon = $('#gameBonnie');
  animate(bon, 'wiggle', 600);
  if (G.tier >= 4) { bubble(fmt("I've shown you the answer, {N}! Now you have a go. 🐾")); return; }
  G.tier++;
  const fn = G.hints[G.tier - 1];
  const tierName = HINT_TIERS[G.tier - 1];
  const txt = fn ? fn() : '';
  if (G.tier === 4) G.helpedNow = true;
  bubble(`<b>${tierName}</b> ${txt}`);
  renderPips();
  if (!G.hintBone) { G.hintBone = true; addBones(1, bon, 'for asking!'); }
}
function onCorrect(el, sayFirst = '') {
  if (G.busy) return; G.busy = true;
  sfx.correct(); shakeScreen();
  let bones;
  if (G.helpedNow) { G.helped++; bones = 1; }
  else {
    streak++;
    if (streak === 3) { banner('🔥 3 in a row! Bone Multiplier Active! ✖2'); sfx.streak(); }
    else if (streak === 5) { banner('🌟 5 in a row! SUPER Multiplier! ✖3'); sfx.streak(); }
    else if (streak > 5 && streak % 5 === 0) { banner(`🚀 ${streak} in a row! Unstoppable!`); sfx.streak(); }
    bones = multiplier();
  }
  G.earned += bones;
  addBones(bones, el || $('#area'));
  renderHud();
  const bon = $('#gameBonnie'); animate(bon, 'happy', 550); hearts(bon, '⭐', 3);
  const praise = G.helpedNow ? fmt("Well done for watching and learning, {N}!") : fmt(rand(PRAISE));
  bubble(praise, false);
  say((sayFirst ? sayFirst + '! ' : '') + praise);
  // move on once Bonnie has finished her well-done (and at least 1.6s, so the stars can be enjoyed)
  const round = G, t0 = Date.now();
  BonnieVoice.whenQuiet(() => setTimeout(() => { if (G !== round) return; G.i++; nextItem(); }, Math.max(500, 1600 - (Date.now() - t0))));
}
function onWrong(msg) {
  G.mistakes++; streak = 0; renderHud(); sfx.wrong();
  animate($('#gameBonnie'), 'wiggle', 600);
  bubble(msg || fmt(rand(OOPS)));
}
function finishLevel() {
  const { w, l } = G;
  const stars = G.mistakes <= 1 && G.helped === 0 ? 3 : G.mistakes <= 4 && G.helped <= 1 ? 2 : 1;
  const prev = P['w' + w].stars[l];
  P['w' + w].stars[l] = Math.max(prev, stars); saveProgress();
  const bonus = CONFIG.LEVEL_BONUS + stars * 2;
  addBones(bonus, $('#area'), 'level bonus!');
  confetti(); sfx.fanfare();
  const hasNext = l < 4;
  const msg = fmt(FINISH_MSGS[stars]);
  modal(`
    ${bonnieHTML('', 'endBonnie')}
    <h2>Level complete!</h2>
    <div class="stars-big">${[0, 1, 2].map(i => `<span style="animation-delay:${.2 + i * .25}s">${i < stars ? '⭐' : '☆'}</span>`).join('')}</div>
    <p>${esc(msg)}</p>
    <p><b>🦴 ${G.earned + bonus} bones</b> earned this level!</p>
    <div class="btns">
      ${hasNext ? '<button class="btn green" data-a="next">Next level →</button>' : ''}
      <button class="btn ghost" data-a="again">Play again</button>
      <button class="btn ghost" data-a="map">Map</button>
    </div>`, a => { if (a === 'next') startLevel(w, l + 1); else if (a === 'again') startLevel(w, l); else worldScreen(w); });
  const eb = $('#endBonnie'); eb.style.margin = '0 auto'; animate(eb, 'happy', 600);
  say(msg);
}

/* =========================================================
   WORLD 1 — PHONICS FOREST
   ========================================================= */
function playPhonics(item) {
  const L = G.L, parts = item.parts, n = parts.length;
  const vIdx = L.split ? n - 3 : -1, eIdx = L.split ? n - 1 : -1;
  const extras = item.extra ? [...item.extra] : [];
  const pool = shuffle(L.pool.filter(p => !parts.includes(p) && !extras.includes(p)));
  while (extras.length < 2 && pool.length) extras.push(pool.shift());
  let order; do { order = shuffle([...parts, ...extras]); } while (order.slice(0, n).join() === parts.join() && n > 1);
  const tiles = order.map((g, id) => ({ id, g }));
  const slot = Array(n).fill(null), lock = Array(n).fill(false);
  const soundOf = (g, i) => (i === vIdx || i === eIdx) ? LONG[parts[vIdx]] : (PH[g] || g);
  const segmented = () => parts.map((g, i) => i === eIdx ? null : soundOf(g, i)).filter(Boolean).join('... ');
  const clue = item.clue ? esc(fmt(item.clue)).replace('___', '<span class="gap">&nbsp;?&nbsp;</span>') : 'Build the word!';

  const area = $('#area');
  area.innerHTML = `
    <div class="clue">
      <div class="clue-pic">${item.emoji}</div>
      <div><div class="clue-text">${clue}</div>
      <div class="row-btns" style="margin-top:10px"><button class="btn small" id="hear">🔊 Hear the word</button></div></div>
    </div>
    <div class="word-wrap"><div class="word-row" id="row"></div></div>
    <div class="row-btns"><button class="btn small ghost" id="blend">🗣️ Blend it!</button></div>
    <div class="bank" id="bank"></div>
    <p class="mode-tip">Drag or tap the wooden letters. Tap the dots to hear each sound!</p>`;
  $('#hear').onclick = () => say(item.word, { rate: .75 });
  $('#blend').onclick = () => {
    const filled = parts.map((_, i) => slot[i] != null ? soundOf(tiles[slot[i]].g, i) : null);
    if (filled.every(x => x == null)) { bubble('Put some letters in first, then we can blend them!'); return; }
    const seq = filled.filter((x, i) => x && i !== eIdx).join('... ');
    const complete = parts.every((p, i) => slot[i] != null && tiles[slot[i]].g === p);
    say(seq + (complete ? '... ' + item.word : ''), { rate: .7 });
  };

  function place(tid, i) {
    if (slot.includes(tid)) slot[slot.indexOf(tid)] = null;
    if (i == null) i = slot.findIndex((s, k) => s == null && !lock[k]);
    if (i < 0 || lock[i]) { draw(); return; }
    slot[i] = tid; sfx.snap(); draw(i);
    if (slot.every(s => s != null)) setTimeout(check, G.helpedNow ? 1300 : 450);
  }
  function unplace(tid) { const i = slot.indexOf(tid); if (i >= 0 && !lock[i]) { slot[i] = null; sfx.pick(); draw(); } }
  function draw(snapIdx = -1) {
    const row = $('#row'); if (!row) return;
    row.innerHTML = parts.map((p, i) => {
      const t = slot[i] != null ? tiles[slot[i]] : null;
      return `<div class="slot-wrap"><div class="slot ${p.length > 1 ? 'wide' : ''} ${lock[i] ? 'locked' : ''}" data-i="${i}">
        ${t ? `<span class="tile in-slot ${i === snapIdx ? 'snap' : ''}" data-t="${t.id}">${esc(t.g)}</span>` : ''}</div>
        <button class="sb ${p.length > 1 ? 'dash' : 'dot'}" data-i="${i}" aria-label="Play sound"></button></div>`;
    }).join('') + (L.split ? '<div class="arc" id="arc"></div>' : '');
    $('#bank').innerHTML = tiles.filter(t => !slot.includes(t.id)).map(t => `<span class="tile" data-t="${t.id}">${esc(t.g)}</span>`).join('');
    $$('#bank .tile').forEach(el => draggable(el, { dropSel: '.slot, #bank', onTap: () => place(+el.dataset.t), onDrop: tg => { if (tg && tg.classList.contains('slot')) place(+el.dataset.t, +tg.dataset.i); } }));
    $$('#row .tile').forEach(el => { const i = slot.indexOf(+el.dataset.t); if (lock[i]) return;
      draggable(el, { dropSel: '.slot, #bank', onTap: () => unplace(+el.dataset.t), onDrop: tg => { if (!tg) return; if (tg.id === 'bank') unplace(+el.dataset.t); else place(+el.dataset.t, +tg.dataset.i); } }); });
    $$('#row .sb').forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (slot[i] == null) { animate(b, 'say', 300); bubble('Put a letter here first, then tap me!', false); return; }
      const g = tiles[slot[i]].g; animate(b, 'say', 400);
      if (L.split && (i === vIdx || i === eIdx)) { $$('#row .sb').filter(x => +x.dataset.i === vIdx || +x.dataset.i === eIdx).forEach(x => animate(x, 'say', 400)); }
      say(soundOf(g, i), { rate: .75 });
    });
    if (L.split) requestAnimationFrame(() => {
      const arc = $('#arc'), sbs = $$('#row .sb'); if (!arc || !sbs[vIdx]) return;
      const rr = $('#row').getBoundingClientRect(), a = sbs[vIdx].getBoundingClientRect(), b = sbs[eIdx].getBoundingClientRect();
      arc.style.left = (a.left - rr.left + a.width / 2) + 'px'; arc.style.width = (b.left - a.left) + 'px';
    });
  }
  function check() {
    if (!G || G.busy || !$('#row')) return;
    const wrong = parts.map((p, i) => tiles[slot[i]].g !== p);
    if (!wrong.includes(true)) {
      lock.fill(true); draw();
      $$('#row .slot').forEach((s, i) => setTimeout(() => animate(s, 'snap', 400), i * 80));
      onCorrect($('#row'), segmented() + '... ' + item.word);
      return;
    }
    wrong.forEach((w, i) => { if (!w) lock[i] = true; });
    $$('#row .slot').forEach((s, i) => wrong[i] && s.classList.add('bad'));
    onWrong(wrong.filter(Boolean).length === 1 ? fmt("So close, {N}! Just one letter needs swapping.") : null);
    setTimeout(() => { wrong.forEach((w, i) => { if (w) slot[i] = null; }); draw(); }, 650);
  }
  G.hints = [
    () => { later(() => say(`Listen... ${segmented()}... ${item.word}`, { rate: .65 }), 1600); return `Say it slowly with me: <b>${esc(item.word)}</b>. How many sounds can you hear?`; },
    () => esc(L.tip),
    () => { // place the next correct tile
      const i = parts.findIndex((p, k) => !lock[k] && (slot[k] == null || tiles[slot[k]].g !== p));
      if (i < 0) return 'You have all the letters — tap Blend it!';
      if (slot[i] != null) slot[i] = null;
      let t = tiles.find(t => t.g === parts[i] && !slot.includes(t.id));
      if (!t) { const k = parts.findIndex((p, k) => slot[k] != null && tiles[slot[k]].g === parts[i] && p !== parts[i]); t = tiles[slot[k]]; slot[k] = null; }
      lock[i] = true; slot[i] = t.id; draw(i); $$('#row .slot')[i].classList.add('glow');
      if (slot.every(s => s != null)) later(check, 600);
      return `I've sniffed out a letter for you: <b>${esc(parts[i])}</b>. Can you do the rest?`;
    },
    () => {
      slot.fill(null); const used = new Set();
      parts.forEach((p, i) => { const t = tiles.find(t => t.g === p && !used.has(t.id)); used.add(t.id); slot[i] = t.id; });
      lock.fill(true); draw(); $$('#row .slot').forEach(s => s.classList.add('glow'));
      later(check, 600); // well-done then sounds it out: segmented... word
      return `Watch me build it: <b>${esc(parts.join(' '))}</b> makes <b>${esc(item.word)}</b>!`;
    },
  ];
  draw();
  bubble(fmt(G.i === 0 ? `Let's build some words, {N}! What's this picture?` : rand(["What word is this?", "Can you build this one?", "Sniff sniff… what's this?"])), false);
  later(() => say(item.word, { rate: .8 }), 300);
}

/* =========================================================
   WORLD 2 — TRICKY WORD TRAIL
   ========================================================= */
function playTricky(item) {
  const sentence = fmt(item.sentence), atStart = sentence.startsWith('___');
  const opts = shuffle([item.word, ...item.wrong]).map(o => atStart ? cap1(o) : o);
  const answer = atStart ? cap1(item.word) : item.word;
  const total = G.items.length;
  const area = $('#area');
  area.innerHTML = `
    <div class="trail" id="trail">
      ${G.items.map((_, i) => `<div class="step ${i < G.i ? 'done' : ''}">${i === G.i ? `<div class="pup">${bonnieSVG()}</div>` : ''}</div>`).join('')}
      <div class="goal">🏁</div>
    </div>
    <div class="tricky-sentence" id="sent">${esc(sentence).replace('___', '<span class="gap" id="gap">&nbsp;</span>')}</div>
    <div class="row-btns"><button class="btn small" id="hear">🔊 Hear the sentence</button></div>
    <div class="signs" id="signs">${opts.map(o => `<button class="sign" data-o="${esc(o)}"><div class="board">${esc(o)}</div></button>`).join('')}</div>
    <p class="mode-tip">Tap the signpost with the correct spelling to clear Bonnie's path!</p>`;
  const full = sentence.replace('___', item.word);
  $('#hear').onclick = () => say(full, { rate: .8 });
  $$('.sign').forEach(b => b.onclick = () => {
    if (G.busy) return;
    if (b.dataset.o === answer) {
      b.classList.add('right'); $('#gap').textContent = answer;
      $$('.sign').forEach(x => x !== b && (x.style.opacity = .3));
      const pup = $('#trail .pup'), steps = $$('#trail .step');
      if (pup && steps[G.i + 1]) { const a = steps[G.i].getBoundingClientRect(), c = steps[G.i + 1].getBoundingClientRect(); pup.style.transform = `translate(calc(-50% + ${c.left - a.left}px), -20px)`; }
      else if (pup) { pup.style.transform = 'translate(20px,-24px) scale(1.1)'; }
      steps[G.i] && steps[G.i].classList.add('done');
      onCorrect(b, `${item.word}... ${item.word.split('').join(', ')}`);
    } else { b.classList.add('wrong'); onWrong(fmt(`Hmm, "${esc(b.dataset.o)}" isn't quite right. Look carefully at each letter!`)); }
  });
  G.hints = [
    () => { later(() => say(`${item.word}. ${full}`, { rate: .7 }), 1500); return `Listen carefully: <b>${esc(item.word)}</b>. Which signpost looks right?`; },
    () => esc(item.tip),
    () => { const w = $$('.sign').find(x => x.dataset.o !== answer && !x.classList.contains('wrong')); if (w) w.classList.add('wrong'); return "Sniff sniff! I've knocked over one wrong signpost for you."; },
    () => { $$('.sign').forEach(x => x.dataset.o === answer ? x.classList.add('glow') : x.classList.add('wrong'));
      later(() => say(`${item.word}. ${item.word.split('').join(', ')}`, { rate: .7 }), 1700);
      return `This is how we spell it: <b>${esc(answer)}</b>. Tap the shiny sign!`; },
  ];
  bubble(fmt(G.i === 0 ? "Help me down the trail, {N}! Pick the right spelling." : rand(["Which one is spelt right?", "Look carefully, word detective!", "Another signpost! Which is right?"])), false);
  later(() => say(`Find the word: ${item.word}. ${full}`, { rate: .85 }), 300);
}

/* =========================================================
   WORLD 3 — SENTENCE MEADOW
   ========================================================= */
function playSentence(raw) {
  const L = G.L, mode = L.mode;
  const words = fmt(raw.w).toLowerCase().split(' ');
  const proper = [...raw.proper.map(x => fmt(x).toLowerCase()), 'i'];
  const accepted = [words, ...raw.alts.map(a => fmt(a).toLowerCase().split(' '))];
  const needsCap = (w, pos) => pos === 0 || proper.includes(w);
  const show1 = (w, capped) => capped ? cap1(w) : w;
  const tokens = words.map((w, id) => ({ id, w, capped: false }));
  const st = { line: [], punct: null };

  if (mode === 'caps') { st.line = tokens.map(t => t.id); st.punct = raw.p; }
  if (mode === 'punct') { st.line = tokens.map(t => t.id); tokens.forEach((t, i) => t.capped = needsCap(t.w, i)); }
  if (mode === 'order') tokens.forEach((t, i) => t.capped = needsCap(t.w, i));
  let bankOrder = shuffle(tokens.map(t => t.id));
  if (bankOrder.join() === tokens.map(t => t.id).join()) bankOrder.reverse();

  const correctText = words.map((w, i) => show1(w, needsCap(w, i))).join(' ') + raw.p;
  const prompts = SENT_PROMPTS;
  const area = $('#area');
  area.innerHTML = `
    <p class="mode-tip" style="font-size:1.3rem;color:var(--ink)">🌼 ${prompts[mode]}</p>
    <div class="row-btns"><button class="btn small" id="hear">🔊 Hear the sentence</button></div>
    <div class="s-line" id="line"></div>
    ${mode === 'order' || mode === 'all' ? '<div class="s-bank" id="sbank"></div>' : ''}
    <div class="badges" id="badges">${L.badges.length > 1 || mode !== 'caps' ? L.badges.map(b => `<span class="badge" data-b="${b}" style="background:${b === '.' ? 'var(--leaf)' : b === '?' ? '#5B9BD5' : 'var(--berry)'}">${b}<small>${b === '.' ? 'full stop' : b === '?' ? 'question' : 'exclaim!'}</small></span>`).join('') : ''}</div>
    <div class="row-btns" style="margin-top:34px"><button class="btn green" id="checkBtn">✓ Check my sentence</button></div>`;
  $('#hear').onclick = () => say(correctText, { rate: .8 });

  function draw(snapId = -1) {
    const line = $('#line');
    line.innerHTML = (st.line.length ? '' : '<span class="ph">Drop words here…</span>') + st.line.map(id => { const t = tokens[id];
      return `<span class="wchip placed ${t.capped ? 'capped' : ''} ${id === snapId ? 'snap' : ''}" data-id="${id}"><span class="first">${esc(show1(t.w, t.capped)[0])}</span>${esc(t.w.slice(1))}${mode === 'all' ? '<button class="aa" aria-label="Capital letter">Aa</button>' : ''}</span>`; }).join('')
      + `<span class="p-slot ${st.punct ? 'filled' : ''}" id="pslot">${st.punct || ''}</span>`;
    const bank = $('#sbank');
    if (bank) bank.innerHTML = bankOrder.filter(id => !st.line.includes(id)).map(id => `<span class="wchip" data-id="${id}">${esc(show1(tokens[id].w, tokens[id].capped))}</span>`).join('');
    // interactions
    $$('#line .wchip').forEach(el => {
      const id = +el.dataset.id;
      if (mode === 'caps') { el.onclick = () => { tokens[id].capped = !tokens[id].capped; sfx.pop(); draw(id); }; return; }
      if (mode === 'punct') return;
      const aa = $('.aa', el); if (aa) aa.onclick = e => { e.stopPropagation(); tokens[id].capped = !tokens[id].capped; sfx.pop(); draw(id); };
      draggable(el, { dropSel: '.wchip.placed, #line, #sbank', onTap: () => { st.line = st.line.filter(x => x !== id); sfx.pick(); draw(); },
        onDrop: tg => { if (!tg) return; if (tg.id === 'sbank') { st.line = st.line.filter(x => x !== id); draw(); } else moveTo(id, tg); } });
    });
    $$('#sbank .wchip').forEach(el => { const id = +el.dataset.id;
      draggable(el, { dropSel: '.wchip.placed, #line', onTap: () => { st.line.push(id); sfx.snap(); draw(id); }, onDrop: tg => tg && moveTo(id, tg) }); });
    $('#pslot').onclick = () => { if (mode !== 'caps' && st.punct) { st.punct = null; sfx.pick(); draw(); } };
  }
  function moveTo(id, tg) {
    st.line = st.line.filter(x => x !== id);
    if (tg.classList.contains('wchip')) { const at = st.line.indexOf(+tg.dataset.id); st.line.splice(at < 0 ? st.line.length : at, 0, id); }
    else st.line.push(id);
    sfx.snap(); draw(id);
  }
  $$('#badges .badge').forEach(b => draggable(b, { dropSel: '#pslot', onTap: () => setP(b.dataset.b), onDrop: tg => tg && setP(b.dataset.b) }));
  function setP(p) { st.punct = p; sfx.snap(); draw(); animate($('#pslot'), 'snap', 400); }

  $('#checkBtn').onclick = () => {
    if (G.busy) return;
    if (st.line.length < words.length) return bubble('Use all the words first! 🐾');
    if (!st.punct) return bubble('Don\'t forget the punctuation mark at the end!');
    const seq = st.line.map(id => tokens[id].w);
    const orderOK = accepted.some(a => a.join(' ') === seq.join(' '));
    const capsOK = st.line.every((id, pos) => tokens[id].capped === needsCap(tokens[id].w, pos));
    const pOK = st.punct === raw.p;
    if (orderOK && capsOK && pOK) {
      const said = st.line.map(id => tokens[id].w).join(' ') + raw.p;
      onCorrect($('#line'), said);
      return;
    }
    let msg;
    if (!orderOK) msg = "Hmm, read it out loud. Does it make sense? Try a different order.";
    else if (!capsOK) { const bad = st.line.find((id, pos) => tokens[id].capped !== needsCap(tokens[id].w, pos));
      msg = needsCap(tokens[bad].w, st.line.indexOf(bad)) ? `Check your capital letters! Does "<b>${esc(tokens[bad].w)}</b>" need one?` : `"<b>${esc(cap1(tokens[bad].w))}</b>" doesn't need a capital letter here.`;
      $$('#line .wchip').find(x => +x.dataset.id === bad)?.classList.add('glow'); }
    else msg = raw.p === '?' ? "Is this sentence asking something? Have another look at the end mark." : raw.p === '!' ? "This sentence shows surprise or excitement! Which end mark shows that?" : "This sentence is telling us something. Which end mark fits?";
    onWrong(msg);
  };
  G.hints = [
    () => { later(() => say(correctText, { rate: .75 }), 1500); return 'Listen to how the sentence sounds. Does your voice go up at the end?'; },
    () => esc(L.tip),
    () => {
      if (mode === 'caps') { const i = words.findIndex((w, p) => needsCap(w, p) !== tokens[p].capped); if (i >= 0) { $$('#line .wchip')[i].classList.add('glow'); return `Look at the word that's glowing: <b>${esc(words[i])}</b>. Does it need a capital?`; } return 'Your capitals look great! Tap Check.'; }
      if (mode === 'punct') { const w = L.badges.find(b => b !== raw.p); $(`.badge[data-b="${w}"]`).classList.add('off'); return "I've taken away one punctuation mark that doesn't fit."; }
      const first = tokens.find(t => t.w === words[0] && st.line[0] !== t.id) || tokens.find(t => t.w === words[0]);
      st.line = [first.id, ...st.line.filter(x => x !== first.id)]; if (mode === 'all') first.capped = true; draw(first.id);
      return `I've put the first word in for you: <b>${esc(cap1(words[0]))}</b>. What comes next?`;
    },
    () => {
      const used = new Set();
      st.line = words.map(w => { const t = tokens.find(t => t.w === w && !used.has(t.id)); used.add(t.id); return t.id; });
      st.line.forEach((id, pos) => tokens[id].capped = needsCap(tokens[id].w, pos)); st.punct = raw.p; draw();
      $$('#line .wchip').forEach(x => x.classList.add('glow')); $('#checkBtn').classList.add('snap');
      later(() => say(correctText, { rate: .75 }), 1700);
      return `Here's my sentence: <b>${esc(correctText)}</b> Tap Check when you've read it!`;
    },
  ];
  draw();
  bubble(fmt(G.i === 0 ? `Let's fix some sentences, {N}! ${prompts[mode]}` : rand(["Here's another one!", "Can you fix this sentence?", "Let's make it perfect!"])), false);
  later(() => say(prompts[mode]), 300);
}

/* =========================================================
   WORLD 4 — BONNIE'S STORY NOOK
   ========================================================= */
function playStory(item) {
  const story = fmt(item.story), answer = fmt(item.answer), q = fmt(item.q);
  const opts = shuffle([answer, ...item.wrong.map(fmt)]);
  const evWords = fmt(item.ev).toLowerCase().split(' ');
  // wrap words in spans; keep track of character offsets for read-aloud highlighting
  const spoken = story.replace('___', '...');
  let html = '', pos = 0; const spans = [];
  story.split(/(\s+)/).forEach(tok => {
    if (/^\s+$/.test(tok)) { html += tok; pos += tok.length; return; }
    if (tok.includes('___')) { html += `<span class="blank" id="blank">&nbsp;?&nbsp;</span>${esc(tok.replace('___', ''))}`; spans.push({ start: pos, idx: -1 }); pos += 3 + tok.replace('___', '').length; return; }
    const i = spans.length; spans.push({ start: pos, idx: i }); html += `<span class="w" data-i="${i}">${esc(tok)}</span>`; pos += tok.length;
  });
  const area = $('#area');
  area.innerHTML = `
    <div class="story" id="story">${html}</div>
    <div class="row-btns" style="margin-top:12px"><button class="btn small" id="read">🔊 Read it to me</button></div>
    <div class="question">❓ ${esc(q)} <button class="btn small ghost" id="hearQ">🔊</button></div>
    <div class="opts" id="opts">${opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  const wordEls = $$('#story .w');
  function readAloud(textToSay = spoken, then) {
    wordEls.forEach(w => w.classList.remove('hl'));
    let got = false, timer = null;
    const hl = ci => { const s = [...spans].reverse().find(s => s.start <= ci); wordEls.forEach(w => w.classList.remove('hl')); if (s && s.idx >= 0) wordEls[s.idx].classList.add('hl'); };
    const u = say(textToSay, { rate: .82,
      onboundary: e => { if (e.name && e.name !== 'word') return; got = true; clearInterval(timer); hl(e.charIndex); },
      onend: () => { clearInterval(timer); wordEls.forEach(w => w.classList.remove('hl')); then && then(); } });
    // fallback if the voice doesn't send word boundaries
    let k = 0; setTimeout(() => { if (got || !u) return; timer = setInterval(() => { if (got || k >= wordEls.length) return clearInterval(timer); wordEls.forEach(w => w.classList.remove('hl')); wordEls[k++].classList.add('hl'); }, 380); }, 600);
  }
  $('#read').onclick = () => readAloud();
  $('#hearQ').onclick = () => say(q);
  $$('.opt').forEach(b => b.onclick = () => {
    if (G.busy) return;
    if (b.dataset.o === answer) {
      b.classList.add('right'); const bl = $('#blank'); if (bl) bl.textContent = answer;
      onCorrect(b, item.type === 'rhyme' ? story.replace('___', answer) : answer);
    } else { b.classList.add('wrong'); onWrong(item.type === 'rhyme' ? `Does "<b>${esc(b.dataset.o)}</b>" rhyme? Say them together and listen!` : fmt("Not quite! Let's look back at the story.")); }
  });
  G.hints = [
    () => { later(() => readAloud(spoken + ' ' + q), 1400); return "Let's read the story again together. Listen carefully!"; },
    () => esc(STORY_TIPS[item.type]),
    () => { const w = $$('.opt').find(x => x.dataset.o !== answer && !x.classList.contains('wrong')); if (w) w.classList.add('wrong');
      wordEls.forEach(el => { if (evWords.includes(el.textContent.toLowerCase().replace(/[^a-z']/g, ''))) el.classList.add('ev'); });
      return "I've highlighted a clue in the story and taken away one wrong answer!"; },
    () => { $$('.opt').forEach(x => x.dataset.o === answer ? x.classList.add('glow') : x.classList.add('wrong'));
      return `The answer is <b>${esc(answer)}</b>. See the clue in green? Tap the shiny answer!`; },
  ];
  bubble(fmt(G.i === 0 ? "Snuggle up, {N}! Let's read a story together." : rand(["Here's another story!", "Ooh, I love this one!", "Story time! Ready?"])), false);
  later(() => readAloud(spoken + ' ... ' + q), 400);
}

/* =========================================================
   MODAL
   ========================================================= */
function modal(inner, onAction) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="card modal">${inner}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a; const keep = onAction ? onAction(a, bg) : false; if (keep !== true) bg.remove(); });
  return bg;
}

/* =========================================================
   EVERY LINE BONNIE CAN SAY — used by tools/make-voice.mjs to
   make recorded clips. Keep in step with the game text above;
   anything missed simply falls back to the device voice.
   ========================================================= */
function allSpokenLines() {
  const out = new Set(), add = (...xs) => xs.forEach(x => out.add(fmt(x)));
  const text = h => String(h).replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&'); // what bubble() reads (textContent)
  const hint = (tier, html) => add(text(`<b>${HINT_TIERS[tier]}</b> ${html}`));
  add(...TICKLES, ...GREETS, ...PRAISE, ...OOPS, ...Object.values(FINISH_MSGS), ...Object.values(SENT_PROMPTS), ...Object.values(STORY_TIPS));
  add('Finish the level before to unlock this one!', 'Well done for watching and learning, {N}!', text("I've shown you the answer, {N}! Now you have a go. 🐾"),
    'Do I look smart?', 'Hello {N}! I am Bonnie. Shall we read together?');
  HATS.filter(h => h.cost > 0).forEach(h => add(`Thank you {N}! I love my ${h.name}!`));
  STARTER_PRIZES.forEach(p => add(`Hooray, {N}! Tell your grown-up you unlocked: ${p.title}!`));
  // World 1 — phonics
  add('Put some letters in first, then we can blend them!', 'So close, {N}! Just one letter needs swapping.');
  hint(2, 'You have all the letters — tap Blend it!');
  PHONICS.forEach(L => L.items.forEach(item => {
    const parts = item.parts, n = parts.length, vIdx = L.split ? n - 3 : -1, eIdx = L.split ? n - 1 : -1;
    const soundOf = (g, i) => (i === vIdx || i === eIdx) ? LONG[parts[vIdx]] : (PH[g] || g);
    [...L.pool, ...parts, ...(item.extra || [])].forEach(g => add(PH[g] || g));
    if (L.split) add(LONG[parts[vIdx]]);
    const seg = parts.map((g, i) => i === eIdx ? null : soundOf(g, i)).filter(Boolean).join('... ');
    add(item.word, `Listen... ${seg}... ${item.word}`, `${seg}... ${item.word}!`);
    hint(0, `Say it slowly with me: <b>${esc(item.word)}</b>. How many sounds can you hear?`); hint(1, esc(L.tip));
    parts.forEach(p => hint(2, `I've sniffed out a letter for you: <b>${esc(p)}</b>. Can you do the rest?`));
    hint(3, `Watch me build it: <b>${esc(parts.join(' '))}</b> makes <b>${esc(item.word)}</b>!`);
  }));
  // World 2 — tricky words
  TRICKY.forEach(L => L.items.forEach(item => {
    const sentence = fmt(item.sentence), atStart = sentence.startsWith('___'), full = sentence.replace('___', item.word);
    const answer = atStart ? cap1(item.word) : item.word, letters = item.word.split('').join(', ');
    add(`Find the word: ${item.word}. ${full}`, `${item.word}. ${full}`, `${item.word}... ${letters}!`, `${item.word}. ${letters}`);
    item.wrong.forEach(o => add(text(fmt(`Hmm, "${esc(atStart ? cap1(o) : o)}" isn't quite right. Look carefully at each letter!`))));
    hint(0, `Listen carefully: <b>${esc(item.word)}</b>. Which signpost looks right?`); hint(1, esc(item.tip));
    hint(2, "Sniff sniff! I've knocked over one wrong signpost for you.");
    hint(3, `This is how we spell it: <b>${esc(answer)}</b>. Tap the shiny sign!`);
  }));
  // World 3 — sentences
  add(text('Use all the words first! 🐾'), "Don't forget the punctuation mark at the end!", "Hmm, read it out loud. Does it make sense? Try a different order.",
    "Is this sentence asking something? Have another look at the end mark.", "This sentence shows surprise or excitement! Which end mark shows that?",
    "This sentence is telling us something. Which end mark fits?");
  hint(0, 'Listen to how the sentence sounds. Does your voice go up at the end?');
  hint(2, 'Your capitals look great! Tap Check.'); hint(2, "I've taken away one punctuation mark that doesn't fit.");
  SENTENCES.forEach(L => { hint(1, esc(L.tip)); L.items.forEach(raw => {
    const words = fmt(raw.w).toLowerCase().split(' ');
    const proper = [...raw.proper.map(x => fmt(x).toLowerCase()), 'i'];
    const needsCap = (w, pos) => pos === 0 || proper.includes(w);
    const correctText = words.map((w, i) => needsCap(w, i) ? cap1(w) : w).join(' ') + raw.p;
    add(correctText);
    [words, ...raw.alts.map(a => fmt(a).toLowerCase().split(' '))].forEach(a => add(a.join(' ') + raw.p + '!'));
    words.forEach(w => { add(text(`Check your capital letters! Does "<b>${esc(w)}</b>" need one?`), text(`"<b>${esc(cap1(w))}</b>" doesn't need a capital letter here.`));
      hint(2, `Look at the word that's glowing: <b>${esc(w)}</b>. Does it need a capital?`); });
    hint(2, `I've put the first word in for you: <b>${esc(cap1(words[0]))}</b>. What comes next?`);
    hint(3, `Here's my sentence: <b>${esc(correctText)}</b> Tap Check when you've read it!`);
  }); });
  // World 4 — stories
  add("Not quite! Let's look back at the story.");
  hint(0, "Let's read the story again together. Listen carefully!");
  hint(2, "I've highlighted a clue in the story and taken away one wrong answer!");
  Object.values(STORY_TIPS).forEach(t => hint(1, esc(t)));
  STORIES.forEach(L => L.items.forEach(item => {
    const story = fmt(item.story), answer = fmt(item.answer), q = fmt(item.q), spoken = story.replace('___', '...');
    add(spoken + ' ... ' + q, (item.type === 'rhyme' ? story.replace('___', answer) : answer) + '!');
    if (item.type === 'rhyme') item.wrong.map(fmt).forEach(o => add(text(`Does "<b>${esc(o)}</b>" rhyme? Say them together and listen!`)));
    hint(3, `The answer is <b>${esc(answer)}</b>. See the clue in green? Tap the shiny answer!`);
  }));
  return [...out];
}

document.addEventListener('pointerdown', () => ac(), { once: true });
if (!S.nameSet) location.replace('index.html'); // no name yet: the Clubhouse asks for it
else { applyTheme(); renderHud(); homeScreen(); BonnieVoice.load(); }
}
