<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meadow Words</title>
<!-- Install as an app (PWA): works offline from the home screen -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FDFBF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meadow Club">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<!-- Meadow Words on the shared engine. It saves only to meadow-save-v1 and only reads the old saves. -->
<script src="bonnie-voice.js"></script>
<script src="meadow-backup.js"></script>
<script src="js/meadow-core.js"></script>
<!-- The worlds: to add one, add its file here. -->
<script src="worlds/y2-english-phonics.js"></script>
<script src="worlds/y2-english-tricky-words.js"></script>
<script src="worlds/y2-english-sentences.js"></script>
<script src="worlds/y2-english-stories.js"></script>
<script>
Meadow.startGame({
  subject: 'english', title: 'Meadow Words', icon: '🌼', homeHref: 'index.html', otherGames: [{ title: 'Meadow Maths', icon: '🔢', href: 'meadow-maths.html' }], 
  greets: ["Hello {N}! Shall we go on a word adventure?", "Woof! Hi {N}! Pick a world to explore!", "Hi {N}! I've hidden some words in the meadow. Let's find them!"],
  testVoice: 'Hello {N}! I am Bonnie. Shall we read together?',
});
</script>
</body>
</html>
