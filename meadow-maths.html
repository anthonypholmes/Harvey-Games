<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meadow Maths</title>
<!-- Install as an app (PWA): works offline from the home screen -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FDFBF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meadow Club">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>
  // Inside the App Store app (Capacitor) the files are already on the iPad, so no service worker.
  window.MEADOW_IN_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if (!window.MEADOW_IN_APP && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
<link href="fonts/fonts.css" rel="stylesheet">
</head>
<body>
<!-- Meadow Maths on the shared engine. It saves only to meadow-save-v1 and only reads the old saves. -->
<script src="js/app-storage.js"></script>
<script src="bonnie-voice.js"></script>
<script src="meadow-backup.js"></script>
<script src="js/meadow-core.js"></script>
<!-- The maths question screen the worlds share, then the worlds: to add one, add its file here. -->
<script src="worlds/y2-maths-kit.js"></script>
<script src="worlds/y2-maths-partitioning.js"></script>
<script src="worlds/y2-maths-number-bonds.js"></script>
<script src="worlds/y2-maths-number-lines.js"></script>
<script src="worlds/y2-maths-arrays.js"></script>
<script src="worlds/y2-maths-sharing.js"></script>
<script src="worlds/y2-maths-sharing-fractions.js"></script>
<script src="worlds/y2-maths-captains-cove.js"></script>
<script>
Meadow.startGame({
  subject: 'maths', title: 'Meadow Maths', icon: '🔢', homeHref: 'index.html', otherGames: [{ title: 'Meadow Words', icon: '🌼', href: 'meadow-words.html' }],  readAloudOption: true,
  greets: ["Woof! I'm Bonnie. Stuck? Tap Ask Bonnie and we'll do it together.", "Hi {N}! Pick a world and let's do some maths!", "Hello {N}! Shall we count some bones?"],
  testVoice: 'Hello {N}! I am Bonnie. Shall we do some maths?',
});
</script>
</body>
</html>
