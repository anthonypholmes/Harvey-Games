<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FDFBF7">
<title>Off to the Clubhouse…</title>
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<!-- The beta is now the live game, so this old address just hops you there. -->
<meta http-equiv="refresh" content="1; url=../index.html">
<script>setTimeout(() => location.replace('../index.html' + location.hash), 600);</script>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html{font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;
  font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:#3E2F27;
  background:linear-gradient(180deg,#BFE3F0 0%,#DFF0C8 70%,#9CCB7A 100%)}
.card{width:100%;max-width:380px;text-align:center;background:#FDFBF7;border:3px solid #EADFCB;border-radius:28px;
  padding:28px 22px 24px;box-shadow:0 6px 0 #D8C8AE,0 18px 36px -14px rgba(90,60,30,.4)}
.paw{font-size:3.4rem;line-height:1;display:inline-block;animation:hop .9s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{margin:12px 0 6px;font-size:1.7rem;font-weight:700}
p{margin:0 0 20px;font-family:'Andika','Trebuchet MS',sans-serif;font-size:1.1rem;color:#7A6A5E;line-height:1.4}
a{display:inline-block;text-decoration:none;font-weight:700;font-size:1.2rem;color:#fff;background:#6BA368;
  border-radius:18px;padding:12px 26px;box-shadow:0 5px 0 #4C7E4A}
a:active{transform:translateY(3px);box-shadow:0 2px 0 #4C7E4A}
@media (prefers-reduced-motion:reduce){.paw{animation:none}}
</style>
</head>
<body>
<main class="card">
  <span class="paw" aria-hidden="true">🐶</span>
  <h1>Bonnie's moved!</h1>
  <p>The new games live at the main address now. Hopping you over to the Clubhouse…</p>
  <a href="../index.html">🏠 Go to the Clubhouse</a>
</main>
</body>
</html>
