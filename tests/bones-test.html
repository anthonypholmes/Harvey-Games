<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bones v1.1 Test</title>
<style>
  #report { position: relative; z-index: 50; max-width: 900px; margin: 16px auto 140px; padding: 16px; font-family: system-ui, sans-serif; background: #FDFBF7; border: 2px solid #EADFCB; border-radius: 18px; color: #3E2F27; }
  #report h1 { font-size: 1.3rem; margin: 0 0 6px; }
  #report p { margin: 0 0 12px; color: #7A6A5E; }
  #result { font-size: 1.25rem; font-weight: 700; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; }
  #result.pass { background: #E4F2E7; color: #3F8B5C; }
  #result.fail { background: #FBE3E3; color: #A93E4F; }
  #report li { margin: 4px 0; }
  #report li.bad { color: #A93E4F; font-weight: 700; }
</style>
</head>
<body>
<script src="../bonnie-voice.js"></script>
<script src="../js/meadow-core.js"></script>
<script>
/* Plays a pretend 10-question level many times with a pretend clock, and checks the bones.
   It uses its own save (meadow-save-bones-test), so the real games are never touched. */
(async () => {
  const TEST_KEY = 'meadow-save-bones-test', W = 'test-bones';
  Meadow.registerWorld({
    id: W, subject: 'test', year: 2, name: 'Bone Test Meadow', icon: '🦴', play: (q, ctx) => { ctx.area.textContent = 'Pretend question ' + (ctx.index + 1); },
    levels: ['ten', 'ten-b', 'ten-c', 'ten-d', 'ten-e'].map(id => ({ id, name: id, count: 10, make: () => ({}) })),
  });
  localStorage.removeItem(TEST_KEY);
  Meadow.startGame({ subject: 'test', title: 'Bones Test', icon: '🦴', homeHref: '../index.html', assetBase: '../', needName: false, saveKey: TEST_KEY });
  Meadow.save.mutate(s => { s.sound = false; s.voice = false; });

  const day = d => () => new Date(2026, 10, d, 10, 0, 0);   // 10am on the dth of November 2026
  const save = () => Meadow.save.get();
  const bones = () => save().bones;
  const runs = (lvl = 'ten') => save().daily.normalRuns[W + '/' + lvl] || 0;
  const closeModals = () => document.querySelectorAll('.modal-bg').forEach(m => m.remove());
  // start a level: answer n questions (all right unless wrong is given), maybe ask Bonnie, and finish if n reaches 10
  function play(n = 10, { lvl = 'ten', wrong = 0, ask = false } = {}) {
    closeModals();
    Meadow.startLevel(W, lvl);
    const extra = !!document.getElementById('extraChip');
    if (ask) Meadow.askedBonnie();
    for (let i = 0; i < wrong; i++) Meadow.wrong(null, { quiet: true });
    for (let i = 0; i < n; i++) { Meadow.correct(null, { auto: false }); Meadow.next(); }
    return extra;
  }
  function fresh(d) { localStorage.removeItem(TEST_KEY); Meadow.save.load(); Meadow.save.mutate(s => { s.sound = false; s.voice = false; }); Meadow.setClock(day(d)); return bones(); }

  const results = [];
  const check = (name, ok, detail) => results.push({ name, ok: !!ok, detail });

  // 1. the worked example: 5 plays in a day, 3 stars on the first: 19 + 10 + 3 + 3 + 3 = 38
  let b0 = fresh(4); const got = []; const extras = [];
  for (let r = 0; r < 5; r++) { const b = bones(); extras.push(play()); got.push(bones() - b); }
  check('5 plays in one day pay 38 bones (3 stars first time)', bones() - b0 === 38 && got.join() === '19,10,3,3,3', `each play: ${got.join(' + ')} = ${bones() - b0}`);
  check('Plays 3, 4 and 5 show the Extra practice chip', extras.join() === 'false,false,true,true,true', extras.join(', '));
  check('Only 2 normal runs were counted', runs() === 2, `normal runs today: ${runs()}`);

  // 2. a new day starts the count again
  Meadow.setClock(day(5)); let b = bones(); const ex2 = play();
  check('A new day: the next play is a normal run again', !ex2 && bones() - b === 10 && runs() === 1 && save().daily.day === '2026-11-05', `paid ${bones() - b}, day ${save().daily.day}, runs ${runs()}`);

  // 3. quitting after one answer uses up a normal run (and pays that bone only once)
  b0 = fresh(4);
  play(1); const after1 = bones() - b0; play(1); const ex3 = play(10);
  check('Quitting after 1 answer uses up a normal run', after1 === 1 && runs() === 2 && ex3, `first quit paid ${after1}, runs ${runs()}, third play extra: ${ex3}`);

  // 4. leaving before answering does not
  b0 = fresh(4);
  play(0); play(0); play(0); const ex4 = play(10);
  check('Leaving before answering does not use up a run', !ex4 && bones() - b0 === 19 && runs() === 1, `paid ${bones() - b0}, runs ${runs()}`);

  // 5. refreshing part-way: the run is already counted and nothing is paid twice
  b0 = fresh(4);
  play(3); Meadow.save.load(); // a refresh reloads the save from storage
  check('A refresh mid-level keeps the count and pays each bone once', runs() === 1 && bones() - b0 === 3, `runs ${runs()}, paid ${bones() - b0}`);

  // 6. a clock moved backwards keeps the stored day and its counts
  b0 = fresh(10); play(); play();
  Meadow.setClock(day(9)); b = bones(); const ex6 = play();
  check('Clock moved back: counts are kept, the play is extra practice', ex6 && bones() - b === 3 && save().daily.day === '2026-11-10' && runs() === 2, `extra ${ex6}, paid ${bones() - b}, day ${save().daily.day}, runs ${runs()}`);
  Meadow.setClock(day(11)); const ex6b = play(0);
  check('…and once the clock passes that day again, a new day starts', !ex6b, `extra ${ex6b}`);

  // 7. asking Bonnie still pays in an extra run
  b0 = fresh(4); play(); play(); b = bones(); const ex7 = play(10, { ask: true });
  check('Asking Bonnie pays 1 bone in an extra run (1 + 3)', ex7 && bones() - b === 4, `paid ${bones() - b}`);

  // 8. 3 bones per new star, only for stars better than the best
  b0 = fresh(4); b = bones(); play(10, { wrong: 2 }); const two = bones() - b; b = bones(); play(); const three = bones() - b;
  check('New stars pay 3 each (2 stars: 10 + 6, then 3 stars: 10 + 3)', two === 16 && three === 13, `${two}, then ${three}`);

  // 9. different levels each get their own 2 normal runs (no cap across the game)
  b0 = fresh(4); ['ten', 'ten-b', 'ten-c', 'ten-d', 'ten-e'].forEach(l => play(10, { lvl: l }));
  check('Five different levels in a day all pay normally', bones() - b0 === 5 * 19, `paid ${bones() - b0}`);

  // 10. an old save with no daily record loads with an empty one
  const before = JSON.parse(localStorage.getItem(TEST_KEY)); delete before.daily; localStorage.setItem(TEST_KEY, JSON.stringify(before));
  Meadow.setClock(day(4)); const s10 = Meadow.save.load();
  check('An old save without the daily record loads with an empty one', s10.daily && s10.daily.day === null && !Object.keys(s10.daily.normalRuns).length, JSON.stringify(s10.daily));
  // and a broken one is tidied
  localStorage.setItem(TEST_KEY, JSON.stringify({ ...before, daily: { day: 'yesterday', normalRuns: { a: 'lots', b: 2 } } }));
  const s11 = Meadow.save.load();
  check('A broken daily record is tidied', s11.daily.day === null && s11.daily.normalRuns.b === 2 && !('a' in s11.daily.normalRuns), JSON.stringify(s11.daily));

  // 11. the real games' save was never touched
  check('Only the test save was used', Meadow.save.key === TEST_KEY, Meadow.save.key);

  Meadow.setClock(); closeModals();
  localStorage.removeItem(TEST_KEY);
  const failed = results.filter(r => !r.ok);
  document.body.insertAdjacentHTML('beforeend', `<div id="report"><h1>🦴 Bones v1.1: rule check</h1>
    <p>Plays a pretend 10-question level with a pretend clock. Uses its own test save, which it deletes at the end.</p>
    <div id="result" class="${failed.length ? 'fail' : 'pass'}">${failed.length ? `✗ ${failed.length} of ${results.length} checks failed` : `✓ All ${results.length} checks passed`}</div>
    <ul>${results.map(r => `<li class="${r.ok ? '' : 'bad'}">${r.ok ? '✓' : '✗'} ${r.name} <small>(${r.detail})</small></li>`).join('')}</ul></div>`);
  window.TEST_RESULT = { passed: !failed.length, results };
})();
</script>
</body>
</html>
