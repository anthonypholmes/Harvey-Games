<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Voice Name Test</title>
<style>
  #report { max-width: 900px; margin: 16px auto; padding: 16px; font-family: system-ui, sans-serif; background: #FDFBF7; border: 2px solid #EADFCB; border-radius: 18px; color: #3E2F27; }
  #report h1 { font-size: 1.3rem; margin: 0 0 6px; } #report p { margin: 0 0 12px; color: #7A6A5E; }
  #result { font-size: 1.25rem; font-weight: 700; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; }
  #result.pass { background: #E4F2E7; color: #3F8B5C; } #result.fail { background: #FBE3E3; color: #A93E4F; }
  #report li { margin: 4px 0; } #report li.bad { color: #A93E4F; font-weight: 700; }
</style>
</head>
<body>
<iframe id="f" style="width:1px;height:1px;border:0;position:absolute;left:-9px" title="a game page"></iframe>
<script>
/* Children's names and Bonnie's voice.
   - A name Bonnie has a recording of is joined into her lines ("Well done, Harvey!").
   - Any other name: she says the same line without it ("Well done!"), in her own voice. Never the device voice.
   - The player's name is never in a question or a story: those are about the story characters (Sarah, Jack …).
   Each game page is opened in turn and asked for every line it can say. Nothing is played or saved for good. */
(async () => {
  const results = [], check = (name, ok, detail = '') => results.push({ name, ok: !!ok, detail: String(detail) });
  const f = document.getElementById('f');
  const open = src => new Promise(r => { f.onload = () => r(f.contentWindow); f.src = src; });
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const kept = {}; // whatever is saved on this address is set aside, and put back at the end
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/^(meadow|harvey)/.test(k)) kept[k] = localStorage.getItem(k); }
  const PAGES = [['Clubhouse', '../index.html'], ['Meadow Maths', '../meadow-maths.html'], ['Meadow Words', '../meadow-words.html'], ["Bonnie's Walk", '../bonnies-walk.html']];
  // Zebedee: no recording. Harvey: recorded. Jack: recorded, and a story character too. Red: no recording, and an ordinary word in the stories.
  const NAMES = ['Zebedee', 'Harvey', 'Jack', 'Red'];
  let characters = [], dropped = new Set(), nameLines = 0;

  for (const name of NAMES) {
    Object.keys(localStorage).filter(k => /^(meadow|harvey)/.test(k)).forEach(k => localStorage.removeItem(k));
    localStorage.setItem('meadow-save-v1', JSON.stringify({ version: 1, name, voice: false, sound: false }));
    let total = 0, inQuestion = [], noClip = [], cantDrop = [];
    for (const [title, src] of PAGES) {
      const w = await open('about:blank').then(() => open(src));
      const V = w.BonnieVoice;
      for (let i = 0; i < 100 && !V.pack; i++) await wait(100);
      V.getAudio = () => ({ state: 'running' }); w.MEADOW_IN_APP = true; V.getName = () => name;
      if (w.Meadow.characters) characters = w.Meadow.characters;
      const said = w.clubhouseLines ? w.clubhouseLines() : w.Meadow.spokenLines();
      const questions = w.clubhouseLines ? [] : w.Meadow.numberLines();
      const has = l => new RegExp('(^|[^\\p{L}])' + name + '($|[^\\p{L}])', 'u').test(l);
      for (const line of [...said, ...questions]) {
        total++;
        // the one known gap: Bonnie's silly guesses of 10,000 or more have no number recordings
        if (!V.plan(line) && !/\d{5,}/.test(line)) noClip.push(`${title}: ${line} [${V.why}]`);
      }
      // the name is only ever somewhere it can be left out ("Well done, {N}!"), never part of what a sentence says
      for (const line of said) for (const s of V.sentences(line)) {
        if (!has(s.raw) || name === 'Red' || name === 'Jack') continue; // those two are also ordinary words in the game ("a red kite", "Jack has 4 carrots")
        const free = V.dropName(V.template(s.raw, name));
        if (free == null) cantDrop.push(`${title}: ${s.raw.trim()}`); else if (name === 'Zebedee') { nameLines++; dropped.add(`${V.template(s.raw, name).trim()} → ${free.trim()}`); }
      }
      if (name === 'Zebedee') questions.filter(has).forEach(l => inQuestion.push(`${title}: ${l}`));
    }
    const kind = name === 'Zebedee' ? 'no recording' : name === 'Red' ? 'no recording, and an ordinary word in the stories' : name === 'Jack' ? 'recorded, and also a story character' : 'recorded';
    check(`${name} (${kind}): every one of ${total} lines is in Bonnie's recorded voice`, total > 3000 && !noClip.length, noClip.length ? `${noClip.length} would use the device voice, e.g. ${noClip.slice(0, 3).join(' | ')}` : 'none use the device voice');
    if (name === 'Zebedee' || name === 'Harvey') check(`${name}: the name is only in greetings and praise, where it can be left out`, !cantDrop.length, cantDrop.slice(0, 4).join(' | ') || 'yes');
    if (name === 'Zebedee') check('No question has the player\'s name in it', !inQuestion.length, inQuestion.slice(0, 4).join(' | ') || 'none do');
  }

  // what a child with an unrecorded name hears
  const w = f.contentWindow, V = w.BonnieVoice;
  const clips = (name, line) => { V.getName = () => name; const p = V.plan(line); return p ? p.map(x => x.file.split('/').pop().replace(/-\w+\.mp3$/, '')).join(' + ') : 'DEVICE VOICE (' + V.why + ')'; };
  const key = t => V.pieceKey(V.cleanPiece(t));
  check('"Well done, Zebedee!" is said as the recording of "Well done!"', clips('Zebedee', 'Well done, Zebedee!') === key('Well done!'), clips('Zebedee', 'Well done, Zebedee!'));
  check('"Well done, Harvey!" joins in the recording of his name', clips('Harvey', 'Well done, Harvey!') === key('Well done,') + ' + harvey', clips('Harvey', 'Well done, Harvey!'));
  check('"buddy" and "friend" are gone', !V.pack.names.buddy && !V.pack.names.friend);
  check('Bonnie can say the story characters\' names', characters.length >= 8 && characters.every(c => V.canSay(c.name)), characters.map(c => c.name).join(', '));
  check('The grown-ups area can tell which names she can say', V.canSay('harvey') && V.canSay(' Harvey ') && !V.canSay('Zebedee') && !V.canSay(''));
  const rules = [['Well done, {N}!', 'Well done!'], ['Hi {N}! Pick a game.', 'Hi! Pick a game.'], ['{N}, look at this!', 'Look at this!'], ['Thank you {N}! I love my golden coat!', 'Thank you! I love my golden coat!'],
    ['Come on {N}, five quick questions!', 'Come on, five quick questions!'], ['Which one, {N}, and why?', 'Which one, and why?'], ['{N} has 4 apples.', null]];
  const wrong = rules.filter(([a, b]) => { const got = V.dropName(a); return (got == null ? null : got.trim()) !== b; });
  check('Taking the name out of a line follows the rules', !wrong.length, wrong.map(([a]) => `${a} → ${V.dropName(a)}`).join(' | ') || rules.length + ' examples');
  check('Every sentence with the name has a name-free version', nameLines > 60 && dropped.size > 25, `${dropped.size} different sentences`);

  Object.keys(localStorage).filter(k => /^(meadow|harvey)/.test(k)).forEach(k => localStorage.removeItem(k));
  Object.entries(kept).forEach(([k, v]) => localStorage.setItem(k, v));
  f.remove();

  const failed = results.filter(r => !r.ok), esc = t => String(t).replace(/</g, '&lt;');
  document.body.insertAdjacentHTML('beforeend', `<div id="report"><h1>Children's names and Bonnie's voice</h1>
    <p>A name with a recording is joined into Bonnie's lines. For any other name she says the same line without it, in her own voice. Questions and stories are about the story characters, never the player.</p>
    <div id="result" class="${failed.length ? 'fail' : 'pass'}">${failed.length ? `✗ ${failed.length} of ${results.length} checks failed` : `✓ All ${results.length} checks passed`}</div>
    <ul>${results.map(r => `<li class="${r.ok ? '' : 'bad'}">${r.ok ? '✓' : '✗'} ${esc(r.name)} <small>(${esc(r.detail)})</small></li>`).join('')}</ul>
    <details><summary>What a child with no recording hears (${dropped.size} sentences)</summary><ul>${[...dropped].sort().map(d => `<li>${esc(d)}</li>`).join('')}</ul></details></div>`);
  window.TEST_RESULT = { passed: !failed.length, results };
})();
</script>
</body>
</html>
