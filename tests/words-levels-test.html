<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Meadow Words New Levels Test</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<style>
  #report { position: relative; z-index: 50; max-width: 900px; margin: 16px auto 140px; padding: 16px; font-family: system-ui, sans-serif; background: #FDFBF7; border: 2px solid #EADFCB; border-radius: 18px; color: #3E2F27; }
  #report h1 { font-size: 1.3rem; margin: 0 0 6px; }
  #report p { margin: 0 0 12px; color: #7A6A5E; }
  #result { font-size: 1.25rem; font-weight: 700; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; }
  #result.pass { background: #E4F2E7; color: #3F8B5C; }
  #result.fail { background: #FBE3E3; color: #A93E4F; }
  #report li { margin: 4px 0; }
  #report li.bad { color: #A93E4F; font-weight: 700; }
</style>
</head>
<body>
<script src="../bonnie-voice.js"></script>
<script src="../js/meadow-core.js"></script>
<script src="../worlds/y2-english-phonics.js"></script>
<script src="../worlds/y2-english-tricky-words.js"></script>
<script src="../worlds/y2-english-sentences.js"></script>
<script src="../worlds/y2-english-stories.js"></script>
<script>
/* Meadow Words, new levels (24 November 2026). Uses its own save (meadow-save-words-levels-test), so a real
   player's save is never touched. It:
   - loads a save made before the new levels (stars on the old level ids) and checks nothing was lost
   - checks the new levels come after the old ones, unlock from the level before, and count in the world's stars
   - plays every new level to the end as a child would (tapping the real buttons), and checks the stars and bones
   - walks Bonnie's whole hint ladder on every kind of question, then finishes the question
   - checks what VoiceOver hears for the new buttons
   ?world=stories (or sentences, phonics) checks one world; ?slow=1 waits as a child would between questions. */
(async () => {
  const TEST_KEY = 'meadow-save-words-levels-test';
  const Q = new URLSearchParams(location.search), ONLY = Q.get('world');
  const results = [], check = (name, ok, detail = '') => results.push({ name, ok: !!ok, detail: String(detail) });
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const closeModals = () => $$('.modal-bg').forEach(m => m.remove());
  const errors = []; window.addEventListener('error', e => errors.push(e.message));

  /* ---------- a save from before the new levels ---------- */
  const OLD = {
    'y2-english-stories': ['rhyme-time', 'who', 'where-and-what', 'mixed-questions', 'longer-stories'],
    'y2-english-sentences': ['capital-letters', 'full-stop-or-question', 'exclamation', 'word-order', 'super-sentences'],
    'y2-english-phonics': ['a-e', 'i-e-o-e', 'u-e-e-e', 'ai-ay', 'ee-ea-igh-ie'],
  };
  const oldStars = {};
  Object.entries(OLD).forEach(([w, ids]) => ids.forEach((id, i) => { if (i < 4) oldStars[`${w}/${id}`] = 3 - (i % 3); }));
  localStorage.removeItem(TEST_KEY);
  Meadow.startGame({ subject: 'english', title: 'Words Test', icon: 'T', homeHref: '../index.html', assetBase: '../', needName: false, saveKey: TEST_KEY });
  await wait(50); closeModals();
  // the player as they were before this update: stars on the old level ids only, and 40 bones
  Meadow.save.mutate(s => { s.name = 'Sam'; s.bones = 40; s.stars = { ...oldStars }; s.voice = false; s.sound = false; s.settings.warmUps = false; s.tips = { walk: true, ask: true, shop: true }; });
  Meadow.save.load(); // read it back from storage, as the updated game does when it opens
  const S = () => Meadow.save.get() || Meadow.save.load();
  check('An old save loads with every star on the old levels', Object.entries(oldStars).every(([k, v]) => S().stars[k] === v), JSON.stringify(S().stars));
  check('...and its bones', S().bones === 40, S().bones);

  const worlds = { stories: 'y2-english-stories', sentences: 'y2-english-sentences', phonics: 'y2-english-phonics' };
  for (const [short, wid] of Object.entries(worlds)) {
    if (ONLY && ONLY !== short) continue;
    const w = Meadow.world(wid), ids = w.levels.map(L => L.id), nOld = OLD[wid].length;
    check(`${short}: the old levels keep their ids and places`, OLD[wid].every((id, i) => ids[i] === id), ids.join(', '));
    check(`${short}: new levels come after them`, ids.length > nOld, ids.slice(nOld).join(', '));
    // level 5 had no stars in the old save, so level 6 is locked; it opens once level 5 has a star
    check(`${short}: the first new level is locked until the level before has a star`, !Meadow.levelUnlocked(w, nOld));
    Meadow.save.mutate(s => { s.stars[`${wid}/${OLD[wid][nOld - 1]}`] = 1; });
    check(`${short}: ...and opens when it has one`, Meadow.levelUnlocked(w, nOld) && !Meadow.levelUnlocked(w, nOld + 1));
  }

  /* ---------- play the new levels ---------- */
  // see the question being played (a world's play() gets it)
  let item = null;
  Object.values(worlds).forEach(id => Meadow.world(id).levels.forEach(L => { if (L.play) { const p = L.play; L.play = (q, ctx) => { item = q; return p(q, ctx); }; } }));
  const click = el => { if (!el) throw new Error('nothing to tap'); el.click(); };
  const nextQ = async () => { const i = (Meadow.round() || {}).index; for (let t = 0; t < 80; t++) { await wait(25); if (!Meadow.round() || $('.modal-bg') || Meadow.round().index !== i) return; } Meadow.next(); await wait(30); };

  /* How a child answers each kind of question, with the real buttons. */
  const SOLVE = {
    'y2-english-stories': async it => {
      if (it.kind === 'ev') {
        click($$('#opts .opt').find(b => b.dataset.o === it.answer)); await wait(20);
        click($$('#story .nk-s')[it.ev[0]]);
      } else {
        const right = it.kind === 'order' ? it.events : it.file.parts.map(p => p.h);
        for (let k = 0; k < right.length; k++) {
          const sl = it.kind === 'order' ? $$('#seq .nk-place')[k] : $$('#story .nk-hslot')[k];
          if (sl.classList.contains('locked')) continue;
          click(sl); await wait(5); click($$('#nkBank .nk-card').find(c => c.textContent === right[k])); await wait(5);
        }
        click($('#checkBtn'));
      }
    },
    'y2-english-sentences': async it => {
      if (it.kind === 'comma') {
        const ws = it.s.replace(/[.!?]$/, '').split(' '), want = new Set(ws.map((x, i) => /,$/.test(x) ? i : -1).filter(i => i >= 0));
        for (const g of $$('#m2Line .m2-gap')) { const i = +g.dataset.i, cur = $(`#m2Line .m2-gap[data-i="${i}"]`); if (want.has(i) !== cur.classList.contains('on')) click(cur); }
        click($('#checkBtn'));
      } else if (it.kind === 'contract') {
        let out = false; const want = [];
        for (const ch of it.full) { if (ch === '[') { out = true; continue; } if (ch === ']') { out = false; continue; } want.push(out && ch !== ' '); }
        want.forEach((w, i) => { const b = $(`#m2Letters .m2-letter[data-i="${i}"]`); if (b && w !== b.classList.contains('out')) click(b); });
        click($('#checkBtn'));
      } else if (it.kind === 'owner') click($$('#m2Line .m2-tap').find(b => b.textContent === it.word));
      else if (it.kind === 'whyapos') click($(`#m2Choices .m2-choice[data-v="${it.miss ? 'missing' : 'belongs'}"]`));
      else if (it.kind === 'join') click($(`#m2Choices .m2-choice[data-v="${it.answer}"]`));
      else if (it.kind === 'kind4') { const c = $(`#m2Choices .m2-choice[data-v="${it.k}"]`); if (!c.disabled) click(c); await wait(10); click($(`#badges .badge[data-b="${it.marks[0]}"]`)); }
    },
    'y2-english-phonics': async it => {
      if (it.kind === 'fill') { click($$('#bank .tile').find(t => t.textContent === it.opts[0])); return; }
      click($(`#spChoices .sp-choice[data-v="${it.kind === 'change' ? it.rule : it.answer}"]`));
      await wait(800); // a second part (why? or which spelling?) comes in after a moment
      const y = $('#spChoices .sp-choice[data-v="y"]'); if (y && !y.disabled) click(y);
    },
  };
  const ladder = async () => { for (let t = 0; t < 4; t++) { click($('#askBtn')); await wait(30); } };
  const kindOf = it => it.kind || it.mode || 'build';

  for (const [short, wid] of Object.entries(worlds)) {
    if (ONLY && ONLY !== short) continue;
    const w = Meadow.world(wid), solve = SOLVE[wid]; if (!solve) continue;
    for (let li = OLD[wid].length; li < w.levels.length; li++) {
      const L = w.levels[li], key = `${wid}/${L.id}`;
      // every question in the bank, not just the 6 a run picks: play the level as many times as it takes
      const seen = new Set(), kindsHelped = new Set();
      for (let run = 0; run < 30 && seen.size < L.items.length; run++) {
        closeModals(); const bones0 = S().bones, errs0 = errors.length;
        Meadow.startLevel(wid, L.id); await wait(30);
        let helpedHere = 0, mistakesHere = 0;
        for (let q = 0; q < 12 && $('#area') && !$('.modal-bg'); q++) {
          const it = item; seen.add(L.items.indexOf(it));
          // once per kind of question: walk all four of Bonnie's hints first (the last one shows the answer)
          if (!kindsHelped.has(kindOf(it))) { kindsHelped.add(kindOf(it)); await ladder(); helpedHere++; }
          try { await solve(it, L); } catch (e) { check(`${short} / ${L.name}: a question could be answered`, false, e.message + ' ' + JSON.stringify(it).slice(0, 160)); break; }
          await wait(20);
          if (Meadow.round() && Meadow.round().busy === false && !$('.modal-bg')) { check(`${short} / ${L.name}: the right answer was accepted`, false, JSON.stringify(it).slice(0, 200)); break; }
          await nextQ();
        }
        await wait(50);
        const done = /Level complete/.test(($('.modal-bg') || {}).textContent || '');
        if (run === 0) {
          check(`${short} / ${L.name}: played to the end`, done);
          const stars = S().stars[key];
          check(`${short} / ${L.name}: stars saved for the new id (helped ${helpedHere} time(s): ${helpedHere ? '2' : '3'} stars)`, stars === (helpedHere > 1 ? 1 : helpedHere ? 2 : 3), `${key}: ${stars}`);
          check(`${short} / ${L.name}: bones were paid`, S().bones > bones0, `${bones0} -> ${S().bones}`);
        }
        if (errors.length > errs0) check(`${short} / ${L.name}: no errors on the page`, false, errors.slice(errs0).join(' | '));
      }
      check(`${short} / ${L.name}: every question in the bank was played and answered (${seen.size}/${L.items.length})`, seen.size === L.items.length);
    }
    // the old levels' stars are still there after playing the new ones
    check(`${short}: the old levels' stars are unchanged`, Object.entries(oldStars).filter(([k]) => k.startsWith(wid)).every(([k, v]) => S().stars[k] === v));
    const ws = w.levels.reduce((n, L) => n + (S().stars[`${wid}/${L.id}`] || 0), 0);
    check(`${short}: the world's star count (journal, map) includes the new levels`, ws > Object.entries(oldStars).filter(([k]) => k.startsWith(wid)).reduce((n, [, v]) => n + v, 0), ws);
  }

  /* ---------- what VoiceOver hears ---------- */
  if (!ONLY || ONLY === 'stories') {
    closeModals(); Meadow.startLevel('y2-english-stories', 'reading-between-the-lines'); await wait(30);
    check('stories: the answers are buttons', $$('#opts .opt').every(b => b.tagName === 'BUTTON'));
    click($$('#opts .opt').find(b => b.dataset.o === item.answer)); await wait(20);
    const ss = $$('#story .nk-s');
    check('stories: in the evidence part each sentence is a button with its words as its name', ss.every((s, i) => s.getAttribute('role') === 'button' && s.tabIndex === 0 && s.getAttribute('aria-label') === `Sentence ${i + 1}: ${(item.text || []).concat(item.file ? item.file.parts.flatMap(p => p.s) : [])[i]}`), ss.map(s => s.getAttribute('aria-label')).join(' | '));
    check('stories: the chosen answer says it was right (not by colour alone)', /correct/.test($('#opts .opt.right').getAttribute('aria-label')));
    check('stories: focus moves to the story for the evidence part', document.activeElement === ss[0]);
    closeModals(); Meadow.startLevel('y2-english-stories', 'story-detective'); await wait(30);
    for (let t = 0; t < 12 && item.kind !== 'order'; t++) { Meadow.startLevel('y2-english-stories', 'story-detective'); await wait(20); }
    check('stories: each place in the order says its number and what is in it', $$('#seq .nk-place').every((b, k) => b.tagName === 'BUTTON' && b.getAttribute('aria-label').startsWith(['1st', '2nd', '3rd', '4th'][k] + ': empty')));
    // a wrong order: the right places stay (with a tick), the wrong ones go back
    const cards = $$('#nkBank .nk-card').map(c => c.textContent), wrongOrder = [...item.events].reverse();
    for (const x of wrongOrder) { click($$('#nkBank .nk-card').find(c => c.textContent === x)); await wait(5); }
    click($('#checkBtn')); await wait(30);
    check('stories: a wrong order is marked with ✗ on the wrong places (not by colour alone)', $$('#seq .nk-place.bad').length > 0 && getComputedStyle($('#seq .nk-place.bad .nk-num'), '::after').content.includes('✗'));
    await wait(950);
    check('stories: ...and those cards go back to choose again', $$('#nkBank .nk-card').length === $$('#seq .nk-place:not(.locked)').length, cards.length);
  }

  if (!ONLY || ONLY === 'sentences') {
    const W = 'y2-english-sentences', until = async (lid, ok) => { for (let t = 0; t < 60; t++) { closeModals(); Meadow.startLevel(W, lid); await wait(10); if (ok(item)) return item; } throw new Error('no such question'); };
    await until('comma-caterpillar', () => true);
    const gaps = $$('#m2Line .m2-gap');
    check('sentences: each comma space is a button that says where it is', gaps.every(g => g.tagName === 'BUTTON' && /^Space after \S+, no comma$/.test(g.getAttribute('aria-label'))), gaps.map(g => g.getAttribute('aria-label')).join(' | '));
    click(gaps[0]); await wait(5);
    check('sentences: ...and says "Comma after" once a comma is in', /^Comma after /.test($('#m2Line .m2-gap').getAttribute('aria-label')));
    check('sentences: in Comma Caterpillar the full stop is not a button', !$('#m2Line .m2-end').closest('button') && !$('#badges .badge'));
    await until('comma-caterpillar', it => /Tom and Leo/.test(it.s));
    $$('#m2Line .m2-gap').forEach(g => { if (/after (bread|milk)/.test(g.getAttribute('aria-label'))) click(g); }); await wait(5);
    click($('#checkBtn')); await wait(10);
    check('sentences: a comma before "and" is explained', /joins the last two things/.test($('#bubble').textContent), $('#bubble').textContent);
    await until('apostrophe-adventures', it => it.kind === 'contract');
    check('sentences: each letter to leave out is a toggle button for VoiceOver', $$('#m2Letters .m2-letter').every(b => b.getAttribute('aria-pressed') === 'false'));
    await until('four-kinds-of-sentences', it => it.k === 'command');
    click($('#m2Choices .m2-choice[data-v="command"]')); await wait(5);
    check('sentences: the end marks are buttons with spoken names, only in the end-mark part', $$('#badges .badge').map(b => b.getAttribute('aria-label')).join() === 'full stop,question mark,exclamation mark');
    click($('#badges .badge[data-b="!"]')); await wait(10);
    check('sentences: a command may end with ! (both . and ! are accepted)', Meadow.round().busy);
    await until('four-kinds-of-sentences', it => it.k === 'command'); click($('#m2Choices .m2-choice[data-v="command"]')); await wait(5); click($('#badges .badge[data-b="."]')); await wait(10);
    check('sentences: ...and with .', Meadow.round().busy);
    await until('joining-sentences', it => /wet/.test(it.s)); click($('#m2Choices .m2-choice[data-v="but"]')); await wait(10);
    check('sentences: a wrong joining word is read back in the sentence', /Bonnie was wet but she had jumped into the pond\. Does that make sense\?/.test($('#bubble').textContent), $('#bubble').textContent);
    closeModals(); Meadow.startLevel(W, 'capital-letters'); await wait(10);
    check('sentences: Capital Letters still shows its end mark as plain text, with no end-mark badges', $('#pslot.p-end') && !$$('#badges .badge').length);
  }

  if (!ONLY || ONLY === 'phonics') {
    const W = 'y2-english-phonics', until = async (lid, ok) => { for (let t = 0; t < 80; t++) { closeModals(); Meadow.startLevel(W, lid); await wait(10); if (ok(item)) return item; } throw new Error('no such question'); };
    let it = await until('tricky-consonants', it => it.g === 'kn');
    check('phonics: the first time a pattern comes up, Bonnie teaches it on a card', $('#spTeach') && /silent k or g/.test($('#spTeach').textContent));
    check('phonics: the letter tiles are buttons that VoiceOver spells out', $$('#bank .tile').every(t => t.getAttribute('role') === 'button' && /^[a-z]( [a-z])*$/.test(t.getAttribute('aria-label'))), $$('#bank .tile').map(t => t.getAttribute('aria-label')).join(' | '));
    check('phonics: the gap is a button, and the given letters are read as letters', $('#row .slot[data-i]').getAttribute('role') === 'button' && $$('#row .slot.given').every(g => g.getAttribute('aria-label')));
    check('phonics: no sound dots or Blend button in the spelling levels (no consonant sounds said on their own)', !$('.sb') && !$('#blend'));
    click($$('#bank .tile').find(t => t.textContent !== it.opts[0])); await wait(20);
    check('phonics: a wrong tile is marked with a cross, not just red', $('#row .slot.bad'));
    check('phonics: ...and Bonnie says it can make the same sound but is not how we spell this word', /how we spell this word/.test($('#bubble').textContent), $('#bubble').textContent);
    await wait(1000);
    check('phonics: ...then that tile is taken away', $$('#bank .tile').length === it.opts.length - 1 && !$('#row .slot.bad'));
    click($$('#bank .tile').find(t => t.textContent === it.opts[0])); await wait(30);
    const spelt = `${it.word[0].toUpperCase() + it.word.slice(1)} is spelt ${it.word.split('').join(', ')}.`;
    check('phonics: the right tile: Bonnie says the word, spells it and says why', $('.sp-why').textContent.trim().startsWith(spelt), $('.sp-why').textContent);
    await nextQ();
    if (item && item.g === 'kn') check('phonics: the second time a pattern comes up, there is a Spelling tip button instead of the card', !$('#spTeach') && $('#tipBtn'));
    it = await until('changing-words', it => it.rule === 'e');
    click($('#spChoices .sp-choice[data-v="double"]')); await wait(10);
    check('phonics: a wrong change is crossed out and cannot be tapped again', $('#spChoices .sp-choice[data-v="double"]').disabled && /not right/.test($('#spChoices .sp-choice[data-v="double"]').getAttribute('aria-label')));
    click($('#spChoices .sp-choice[data-v="e"]')); await wait(20);
    check('phonics: dropping the e shows the e crossed out, and VoiceOver hears "e, dropped"', $('#spRow .sp-l.gone') && $('#spRow .sp-l.gone').getAttribute('aria-label') === 'e, dropped');
    check('phonics: ...and the new word', $('#spWord').textContent === it.root.slice(0, -1) + it.suf);
    it = await until('changing-words', it => it.root === 'hop');
    click($('#spChoices .sp-choice[data-v="double"]')); await wait(800);
    check('phonics: some questions then ask why', $('#askP') && /Why\?/.test($('#askP').textContent) && $$('#spChoices .sp-choice').length === 2);
    click($('#spChoices .sp-choice[data-v="y"]')); await wait(20);
    check('phonics: ...and the reason says the word', /hopping/.test($('.sp-why').textContent), $('.sp-why').textContent);
    it = await until('suffix-builders', it => it.root === 'happy');
    click($(`#spChoices .sp-choice[data-v="${it.answer}"]`)); await wait(800);
    check('phonics: happy + ness then asks which spelling is right', $$('#spChoices .sp-choice').map(b => b.textContent).sort().join() === 'happiness,happyness');
    click($('#spChoices .sp-choice[data-v="n"]')); await wait(10);
    check('phonics: ...happyness is wrong', /Does the y change/.test($('#bubble').textContent));
    click($('#spChoices .sp-choice[data-v="y"]')); await wait(20);
    check('phonics: ...happiness is right, and fills the sentence', $('#spGap').textContent === 'happiness');
    closeModals(); Meadow.startLevel(W, 'a-e'); await wait(20);
    check('phonics: the first five levels still build words with sound dots and Blend', $('.sb') && $('#blend') && !$('#spTeach'));
  }

  closeModals();
  const failed = results.filter(r => !r.ok);
  document.body.insertAdjacentHTML('afterbegin', `<div id="report"><h1>Meadow Words new levels test</h1><p>Plays every new level with the real buttons, on its own save.</p>
    <div id="result" class="${failed.length ? 'fail' : 'pass'}">${failed.length ? `${failed.length} of ${results.length} checks failed` : `All ${results.length} checks passed`}</div>
    <ol>${results.map(r => `<li class="${r.ok ? '' : 'bad'}">${r.ok ? '✓' : '✗'} ${r.name}${r.detail && !r.ok ? ` — <code>${r.detail.replace(/</g, '&lt;')}</code>` : ''}</li>`).join('')}</ol></div>`);
  window.TEST_RESULT = { passed: results.length - failed.length, failed: failed.length, failures: failed };
  localStorage.removeItem(TEST_KEY);
})();
</script>
</body>
</html>
