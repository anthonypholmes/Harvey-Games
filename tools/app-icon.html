<!doctype html>
<!-- The App Store app's icon, drawn with the game's own Bonnie. tools/make-icon.sh turns this page
     into ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png (1024 x 1024, no see-through parts).
     iOS rounds the corners itself, so the picture fills the whole square. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Meadow Clubhouse app icon</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; }
  #icon { position: relative; width: 1024px; height: 1024px; overflow: hidden;
    background: linear-gradient(180deg, #9ED6EC 0%, #CDEBF3 48%, #E9F5D3 72%);
    --fur: #9a6440; --fur-dk: #74472a; --fur-lt: #c99568; }
  #sun { position: absolute; right: 96px; top: 84px; width: 170px; height: 170px; border-radius: 50%; background: #FFE08A; box-shadow: 0 0 0 26px rgba(255, 224, 138, .35); }
  .hill { position: absolute; border-radius: 50%; }
  #hill1 { left: -260px; bottom: -520px; width: 1100px; height: 860px; background: #8FC46B; }
  #hill2 { right: -320px; bottom: -560px; width: 1200px; height: 900px; background: #6BA368; }
  #bonnie { position: absolute; left: 62px; top: 118px; width: 900px; height: 900px; filter: drop-shadow(0 18px 0 rgba(60, 40, 20, .16)); }
  #bonnie svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .daisy { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: #F2C14E; box-shadow: 0 0 0 16px #fff; }
</style>
</head>
<body>
<div id="icon">
  <div id="sun"></div>
  <div class="hill" id="hill1"></div>
  <div class="hill" id="hill2"></div>
  <div class="daisy" style="left:70px;bottom:92px"></div>
  <div id="bonnie"></div>
</div>
<script src="../js/meadow-core.js"></script>
<script>
  // Bonnie with no hat or collar, shown from the shoulders up so her face is clear at small sizes.
  document.getElementById('bonnie').innerHTML = Meadow.ui.bonnieSVG(null).replace('viewBox="0 0 120 124"', 'viewBox="8 12 104 104"');
</script>
</body>
</html>
