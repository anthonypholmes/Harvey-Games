<!doctype html>
<!-- App Store screenshots. tools/make-screenshots.sh opens this page six times (?shot=1 … 6) in
     Google Chrome and saves each as a 2064 x 2752 picture in docs/screenshots/.
     Each one is the real game page in a frame, with a caption above. The player is a made-up "Sam".
     It must be opened through a web server (the script starts one), not as a file. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Meadow Clubhouse screenshots</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1032px; height: 1376px; overflow: hidden; }
  body { background: linear-gradient(180deg, #6BA368 0%, #8FC46B 100%); font-family: 'Fredoka', system-ui, sans-serif; color: #fff; }
  #cap { height: 208px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 40px; box-sizing: border-box; }
  #cap h1 { margin: 0; font-size: 58px; line-height: 1.1; font-weight: 700; text-shadow: 0 4px 0 rgba(0, 0, 0, .16); }
  #cap p { margin: 12px 0 0; font-size: 31px; font-weight: 500; opacity: .96; }
  #frame { position: absolute; left: 30px; right: 30px; top: 208px; bottom: -40px; border-radius: 44px; overflow: hidden; background: #F6EBD3; box-shadow: 0 0 0 10px rgba(255, 255, 255, .55), 0 18px 50px rgba(0, 0, 0, .3); }
  iframe { width: 100%; height: calc(100% - 40px); border: 0; display: block; }
</style>
</head>
<body>
<div id="cap"><h1 id="capH"></h1><p id="capP"></p></div>
<div id="frame"><iframe id="game" title="The game"></iframe></div>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
const frame = document.getElementById('game');
const open = src => new Promise(r => { frame.onload = () => r(frame.contentWindow); frame.src = src; });
const click = (w, sel) => { const el = w.document.querySelector(sel); if (el) el.click(); return !!el; };
const levelId = (w, world, n) => w.Meadow.world(world).levels[n].id;

const SHOTS = [
  { h: 'Year 2 maths and English', p: 'with Bonnie the dog cheering them on', page: '../index.html' },
  { h: 'Help that teaches', p: 'Bonnie gives a clue, then shows how', page: '../meadow-maths.html',
    run: async w => { w.Meadow.startLevel('y2-maths-number-bonds', levelId(w, 'y2-maths-number-bonds', 1)); await wait(2500); click(w, '#mmAsk'); await wait(2500); click(w, '#mmAsk'); await wait(1500); } },
  { h: '6 maths worlds, 38 levels', p: 'The maths Year 2 children learn at school', page: '../meadow-maths.html' },
  { h: 'Phonics, spelling and stories', p: '4 English worlds, 20 levels', page: '../meadow-words.html',
    run: async w => { w.Meadow.startLevel('y2-english-phonics', levelId(w, 'y2-english-phonics', 0)); } },
  { h: 'Earn bones for hats and prizes', p: 'Coats, hats, themes and real-life treats', page: '../meadow-words.html#shop' },
  { h: 'A walk with Bonnie every day', p: '5 quick questions. Nothing can be failed.', page: '../bonnies-walk.html',
    run: async w => { await wait(600); w.Meadow.walk.skipHello(); await wait(3000); } },
];

/* A made-up player with some progress, so the pages look lived in. */
function makeSam(w) {
  const M = w.Meadow, day = (() => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; })();
  w.localStorage.clear(); w.sessionStorage.clear();
  M.save.load();
  M.save.mutate(s => {
    s.name = 'Sam'; s.bones = 86; s.voice = false; s.sound = false; s.settings.warmUps = false; s.settings.teachBonnie = false;
    s.neck = 'collar-red'; s.face = 'sunglasses'; s.owned.hats = ['collar-red', 'sunglasses'];
    M.worlds().forEach((world, wi) => {
      const done = Math.max(1, Math.min(world.levels.length - 1, [4, 3, 2, 2, 1, 2, 3, 2, 2, 1][wi] || 1));
      world.levels.slice(0, done).forEach((L, li) => {
        const key = world.id + '/' + L.id, stars = li === done - 1 ? 2 : 3;
        s.stars[key] = stars;
        if (li === done - 1) s.starLog.push({ key, from: 0, to: stars, day });
      });
    });
  });
}

(async () => {
  const n = Math.max(1, Math.min(SHOTS.length, +(new URLSearchParams(location.search).get('shot')) || 1)), shot = SHOTS[n - 1];
  document.getElementById('capH').textContent = shot.h;
  document.getElementById('capP').textContent = shot.p;
  makeSam(await open('../index.html'));
  const w = await open(shot.page);
  // fade-ins don't always finish while Chrome is taking the picture, so switch them off
  w.document.head.insertAdjacentHTML('beforeend', '<style>*, *::before, *::after { animation: none !important; transition: none !important; } .butterfly { display: none !important; }</style>');
  await wait(700);
  if (shot.run) await shot.run(w);
  await wait(1500);
  document.title = 'ready';
})();
</script>
</body>
</html>
