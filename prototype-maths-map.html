<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meadow Maths: map prototype</title>
<!-- PROTOTYPE of the illustrated world map (design iteration 2). Not linked from the game and not in the app build.
     Compare it with the current design in prototype-compare.html. See docs/PROTOTYPE_MAP.md. -->
<script>
  // ?taster=1 shows the App Store app's free taster (padlocks after level 1), as if inside the app.
  var Q = new URLSearchParams(location.search);
  window.MEADOW_IN_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) || Q.get('taster') === '1';
  if (Q.get('taster') === '1') { try { localStorage.removeItem('meadow-full-game'); } catch (e) {} }
</script>
<link href="fonts/fonts.css" rel="stylesheet">
</head>
<body>
<script src="bonnie-voice.js"></script>
<script src="js/meadow-core.js"></script>
<script src="worlds/y2-maths-kit.js"></script>
<script src="worlds/y2-maths-partitioning.js"></script>
<script src="worlds/y2-maths-number-bonds.js"></script>
<script src="worlds/y2-maths-number-lines.js"></script>
<script src="worlds/y2-maths-arrays.js"></script>
<script src="worlds/y2-maths-sharing.js"></script>
<script src="worlds/y2-maths-sharing-fractions.js"></script>
<script src="worlds/y2-maths-captains-cove.js"></script>
<script>
  // the prototype's own scripts are always fetched fresh, so a phone or iPad never shows an old copy
  var fresh = src => document.write('<script src="' + src + '?v=' + Date.now() + '"><\/script>');
  fresh('js/proto-demo.js');
</script>
<script>
  // demo=1 (some progress) or demo=new (a new player): a pretend save of its own (js/proto-demo.js), so the family's real progress is never touched.
  var demo = Q.get('demo') === 'new' ? 'new' : Q.get('demo') === '1' ? '1' : '';
  Meadow.startGame({
    subject: 'maths', title: 'Meadow Maths', icon: '🔢', homeHref: 'index.html', readAloudOption: true,
    otherGames: [{ title: 'Meadow Words', icon: '🌼', href: 'meadow-words.html' }],
    greets: ["Woof! I'm Bonnie. Stuck? Tap Ask Bonnie and we'll do it together.", "Hi {N}! Pick a world and let's do some maths!", "Hello {N}! Shall we count some bones?"],
    saveKey: demo ? ProtoDemo.KEY : undefined, needName: !demo,
  });
  if (demo) { ProtoDemo.seed(demo); Meadow.save.load(); Meadow.home(); }
</script>
<script>fresh('js/proto-map-art.js'); fresh('js/proto-map.js');</script>
</body>
</html>
