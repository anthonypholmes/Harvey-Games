<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meadow Clubhouse</title>
<!-- Install as an app (PWA): works offline from the home screen -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FDFBF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meadow Club">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Meadow Clubhouse — arcade home page. Asks for the player's name,
   which every game then uses.
   Same storybook look as the games: #FDFBF7 parchment cards.
   ========================================================= */
:root{
  --card:#FDFBF7; --card-edge:#EADFCB; --ink:#4A3B2C; --ink-soft:#7A6A58;
  --accent:#E07A3F; --accent-dark:#B85C26; --leaf:#6BA368; --leaf-dark:#4C7E4A;
  --gold:#F2C14E; --berry:#D9596B; --wood:#D9A86C; --wood-light:#EDC994; --wood-dark:#9A6A3A;
  --bg1:#F6EBD3; --bg2:#E7D9B8; --on-bg:#4A3B2C;
  --shadow:0 6px 0 rgba(74,59,44,.12), 0 14px 28px rgba(74,59,44,.10);
  --fur:#9a6440; --fur-dk:#74472a; --fur-lt:#c99568;
  --font-ui:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-read:'Andika','Trebuchet MS',sans-serif;
}
body[data-theme="sunset"]{background:radial-gradient(900px 600px at 85% 105%,rgba(255,190,110,.55),transparent 65%),radial-gradient(1000px 650px at 0% 0%,rgba(247,150,140,.35),transparent 60%),radial-gradient(800px 600px at 100% 0%,rgba(170,130,200,.28),transparent 60%),#FFF1E6!important;background-attachment:fixed}
body[data-theme="night"]{--on-bg:#F3EEDF;background:radial-gradient(700px 500px at 85% 0%,rgba(120,130,200,.35),transparent 60%),radial-gradient(900px 700px at 0% 100%,rgba(60,40,110,.45),transparent 60%),#1C2140!important;background-attachment:fixed}
body[data-theme="snow"]{background:radial-gradient(900px 600px at 10% 0%,rgba(180,212,240,.6),transparent 60%),radial-gradient(800px 600px at 100% 100%,rgba(255,255,255,.9),transparent 60%),#EEF5FB!important;background-attachment:fixed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font-ui);color:var(--ink);overflow-x:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(1200px 600px at 20% -10%,rgba(255,255,255,.55),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
.wrap{position:relative;z-index:2;max-width:1050px;margin:0 auto;padding:16px 16px 130px}

/* ---------- Top bar ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:10px}
.chip{background:var(--card);border:2px solid var(--card-edge);border-radius:999px;padding:6px 14px;font-weight:600;font-size:1.15rem;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(74,59,44,.12)}
.chip.bump{animation:bump .45s}

/* ---------- Clubhouse sign ---------- */
.sign{position:relative;margin:8px auto 22px;max-width:760px;text-align:center}
.sign .board{position:relative;background:linear-gradient(180deg,var(--wood-light),var(--wood));border:4px solid var(--wood-dark);border-radius:26px;padding:20px 24px 18px;box-shadow:var(--shadow), inset 0 3px 0 rgba(255,255,255,.4)}
.sign .board::after{content:"";position:absolute;inset:10px;border-radius:18px;pointer-events:none;background:repeating-linear-gradient(100deg,transparent 0 14px,rgba(154,106,58,.08) 14px 17px)}
.sign h1{margin:0;font-size:clamp(1.8rem,6vw,3.2rem);line-height:1.1;color:#3B2A1A;text-shadow:0 3px 0 rgba(255,255,255,.45)}
.sign .lights{display:flex;justify-content:space-around;margin-top:12px}
.sign .lights span{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:twinkle 1.6s infinite}
.sign .lights span:nth-child(odd){animation-delay:.8s}
.sign .post{position:absolute;top:100%;width:16px;height:22px;background:var(--wood-dark);border-radius:0 0 4px 4px}

/* ---------- Bonnie welcome ---------- */
.welcome{display:flex;align-items:center;gap:18px;background:var(--card);border:2px solid var(--card-edge);border-radius:24px;box-shadow:var(--shadow);padding:14px 20px;margin-bottom:22px}
.welcome p{margin:0;font-family:var(--font-read);font-size:clamp(1.1rem,2.6vw,1.35rem);line-height:1.4}
.welcome .hint{font-family:var(--font-ui);font-size:.9rem;color:var(--ink-soft);margin-top:4px}
.bonnie{position:relative;width:120px;height:120px;flex:none;cursor:pointer}
.bonnie svg{width:100%;height:100%;overflow:visible}
.bonnie .eyes{transform-origin:60px 52px;animation:blink 5s infinite}
.bonnie .tail{transform-origin:86px 100px;animation:wag 1.4s ease-in-out infinite}
.bonnie.giggle{animation:giggle .9s}

/* ---------- Arcade cabinets ---------- */
.cabinets{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px}
.cab{position:relative;display:flex;flex-direction:column;background:var(--card);border:3px solid var(--card-edge);border-radius:30px 30px 18px 18px;box-shadow:var(--shadow);overflow:hidden;transition:transform .18s}
.cab:hover{transform:translateY(-5px) rotate(-.6deg)}
.cab:active{transform:scale(.98)}
.marquee{padding:14px 16px;text-align:center;color:#fff;font-weight:700;font-size:1.5rem;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.2);position:relative}
.marquee small{display:block;font-size:.85rem;font-weight:500;opacity:.95;letter-spacing:0}
.screen{margin:16px 18px 6px;height:170px;border-radius:20px;border:6px solid #3B2A1A;position:relative;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.screen::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 2px,transparent 2px 4px);pointer-events:none}
.screen .bit{position:absolute;font-size:2.4rem;animation:bob 2.4s ease-in-out infinite}
.screen .big{font-family:var(--font-read);font-weight:700;color:#3B2A1A;background:rgba(253,251,247,.9);border-radius:12px;padding:4px 12px;position:absolute;font-size:1.6rem;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.cab .about{padding:6px 20px 0;font-family:var(--font-read);font-size:1.05rem;color:var(--ink-soft);text-align:center;min-height:3em}
.cab .stats{display:flex;justify-content:center;gap:10px;padding:8px 16px 0;font-weight:600;color:var(--wood-dark)}
.play{margin:14px 20px 20px;padding:14px;border-radius:18px;font-size:1.4rem;font-weight:700;color:#fff;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.22);animation:pulse 2s ease-in-out infinite}
.cab.soon{opacity:.75}
.cab.soon:hover{transform:none}
.cab.soon .play{background:#BFB3A0;animation:none;box-shadow:0 6px 0 #9A8E7C}

/* ---------- Footer ---------- */
.foot{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--card);border:2px solid var(--card-edge);border-radius:14px;padding:10px 18px;font-weight:600;font-size:1rem;box-shadow:0 4px 0 var(--card-edge)}
.btn:active{transform:translateY(3px);box-shadow:none}
.name-card{display:grid;gap:14px;justify-items:center;text-align:center;background:var(--card);border:3px solid var(--card-edge);border-radius:28px;box-shadow:var(--shadow);padding:26px 20px;max-width:560px;margin:0 auto 22px}
[hidden]{display:none!important}
.name-card label{font-size:clamp(1.5rem,4vw,2rem);font-weight:700}
.name-card input{font-family:var(--font-ui);font-size:clamp(1.8rem,6vw,2.6rem);font-weight:700;text-align:center;width:100%;max-width:420px;padding:12px;border-radius:18px;border:3px solid var(--card-edge);background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.name-card input:focus{outline:none;border-color:var(--accent)}
.name-msg{margin:0;min-height:1.3em;color:var(--berry);font-weight:600}
.name-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.play-btn{flex:1;max-width:420px;padding:16px;border-radius:18px;font-size:1.5rem;font-weight:700;color:#fff;background:var(--leaf);box-shadow:0 6px 0 var(--leaf-dark)}
.play-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--leaf-dark)}
.note{text-align:center;color:var(--on-bg);opacity:.8;font-size:.9rem;margin-top:14px}

/* ---------- Meadow & critters ---------- */
.meadow{position:fixed;left:0;right:0;bottom:0;height:90px;z-index:1;pointer-events:none;
  background:radial-gradient(14px 10px at 8% 30%,#F7D96B 40%,transparent 42%),radial-gradient(12px 9px at 27% 45%,#fff 40%,transparent 42%),
   radial-gradient(14px 10px at 61% 35%,#F29BB0 40%,transparent 42%),radial-gradient(12px 9px at 83% 40%,#fff 40%,transparent 42%),
   radial-gradient(14px 10px at 94% 25%,#F7D96B 40%,transparent 42%),linear-gradient(180deg,transparent 0 20%,#9CCB7C 20% 100%);
  border-top-left-radius:50% 30px;border-top-right-radius:50% 30px}
.butterfly{position:fixed;z-index:1;font-size:1.8rem;pointer-events:none;animation:flutter 18s linear infinite}
.butterfly span{display:inline-block;animation:flap .35s ease-in-out infinite alternate}
.frog{position:fixed;bottom:32px;left:-60px;z-index:3;font-size:2.4rem;cursor:pointer;animation:frogTrip 26s linear infinite}
.frog span{display:inline-block;animation:hopY 1.3s ease-in-out infinite}
.frog.boing span{animation:bigHop .7s}
.heart{position:fixed;pointer-events:none;z-index:60;font-size:1.6rem;animation:floatUp 1.2s ease-out forwards}

@keyframes bump{50%{transform:scale(1.25)}}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes twinkle{50%{opacity:.35;box-shadow:none}}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(18deg)}}
@keyframes giggle{0%,100%{transform:rotate(0)}10%,50%{transform:rotate(-10deg) scale(1.05)}30%,70%{transform:rotate(10deg) scale(1.05)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
@keyframes flutter{0%{transform:translate(-10vw,60vh)}25%{transform:translate(30vw,20vh)}50%{transform:translate(60vw,45vh)}75%{transform:translate(85vw,10vh)}100%{transform:translate(110vw,40vh)}}
@keyframes flap{to{transform:scaleX(.55)}}
@keyframes frogTrip{0%{left:-60px}100%{left:calc(100vw + 60px)}}
@keyframes hopY{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes bigHop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-70px) rotate(-20deg)}}
@media (max-width:560px){
  .welcome{flex-direction:column;text-align:center}
  .bonnie{width:96px;height:96px}
  .screen{height:140px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .butterfly,.frog{display:none}
}
</style>
</head>
<body data-theme="day">
<div class="meadow" aria-hidden="true"></div>
<div class="butterfly" style="animation-delay:-2s" aria-hidden="true"><span>🦋</span></div>
<div class="butterfly" style="animation-delay:-11s;animation-duration:24s;filter:hue-rotate(120deg)" aria-hidden="true"><span>🦋</span></div>
<div class="frog" id="frog" role="button" aria-label="Frog"><span>🐸</span></div>

<div class="wrap">
  <div class="top">
    <div class="chip" id="boneChip" title="Bones in Bonnie's bone bowl">🦴 <span id="boneNum">0</span></div>
  </div>

  <header class="sign">
    <div class="board">
      <h1 id="title">Meadow Clubhouse</h1>
      <div class="lights" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="post" style="left:18%"></div><div class="post" style="right:18%"></div>
  </header>

  <section class="welcome">
    <div class="bonnie" id="bonnie" role="button" aria-label="Bonnie the dog"></div>
    <div>
      <p id="say"></p>
      <div class="hint">Tap Bonnie to tickle her! 🐾 Bones from every game go in the same bone bowl.</div>
    </div>
  </section>

  <form class="name-card" id="nameCard" autocomplete="off" hidden>
    <label for="nameIn" id="nameLabel">What’s your name?</label>
    <input id="nameIn" maxlength="16" autocapitalize="words" spellcheck="false" placeholder="Type your name">
    <p class="name-msg" id="nameMsg" aria-live="polite"></p>
    <div class="name-btns">
      <button class="play-btn" type="submit">🐾 Let’s play!</button>
      <button class="btn" type="button" id="nameCancel" hidden>Cancel</button>
    </div>
  </form>

  <main class="cabinets" id="cabinets"></main>

  <div class="foot">
    <button class="btn" id="soundBtn">🔊 Sound: on</button>
    <button class="btn" id="changeName">✏️ Change name</button>
  </div>
  <p class="note">Spend your bones in the Bone Shop inside any game.</p>
</div>

<script>
/* =========================================================
   CONFIG — edit the game links to match your file names.
   SHARED_KEY must be the same key the games use for bones.
   ========================================================= */
const CONFIG = {
  SHARED_KEY: 'harvey-splitter-v1',   // Meadow Maths' save — shared by every game
  GAMES: [
    { name: 'Meadow Maths',  sub: 'Numbers, sums & times tables', href: 'meadow-maths.html', color: '#6BA368', dark: '#4C7E4A',
      screen: 'linear-gradient(180deg,#BFE3F0,#DFF0C8)', about: 'Count, add, take away and multiply with Bonnie!', progress: 'maths',
      bits: [['➕', 12, 18], ['✖️', 70, 62], ['🔢', 40, 10], ['🍎', 78, 14]], big: ['3 + 4 = 7', 18, 52] },
    { name: 'Meadow Words',  sub: 'Phonics, spelling & stories', href: 'meadow-words.html', color: '#E07A3F', dark: '#B85C26',
      screen: 'linear-gradient(180deg,#FBE3D2,#F6EBD3)', about: 'Build words, spell tricky words, fix sentences and read stories!',
      bits: [['📖', 10, 14], ['🌼', 76, 60], ['🪧', 74, 10], ['🐝', 14, 64]], big: ['c a k e', 28, 40], progress: 'words' },
    // Add more games here later, e.g.:
    // { name: 'Meadow Science', sub: 'Coming soon', href: '', soon: true, color: '#8E7CC3', dark: '#6A5A9E', screen: '...', about: '...', bits: [], big: ['?', 45, 40] },
  ],
};

/* ---------- shared economy (read-only here) ---------- */
function readRaw() { try { return JSON.parse(localStorage.getItem(CONFIG.SHARED_KEY) || 'null') || {}; } catch (e) { return {}; } }
function loadShared() {
  const s = readRaw();
  return { childName: s.name || '', hasName: !!s.name, bones: Math.max(0, Math.floor(+s.bones || 0)),
           hat: s.hat || null, theme: s.theme || 'day', sfx: s.sound !== false, raw: s };
}
let S = loadShared();
let soundOn = S.sfx;
try { const v = localStorage.getItem('meadowClubhouse_sound'); if (v !== null) soundOn = v === '1'; } catch (e) {}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rand = a => a[Math.floor(Math.random() * a.length)];

function curls(cx, cy, R, n, r) {
  let s = '';
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; s += `<circle cx="${(cx + Math.cos(a) * R).toFixed(1)}" cy="${(cy + Math.sin(a) * R).toFixed(1)}" r="${r}"/>`; }
  return s;
}
const ear = (x, dir) => [[0, 42, 10], [dir * 3, 53, 10], [dir * 1, 64, 9.5], [dir * 4, 74, 8.5], [dir * 1, 82, 7]]
  .map(([dx, y, r]) => `<circle cx="${x + dx}" cy="${y}" r="${r}"/>`).join('');
function hatSVG(h) {
  switch (h) {
    case 'party': return '<g class="hat"><path d="M44 27 L63 -6 L78 25 Z" fill="#F07CA8" stroke="#3E2F27" stroke-width="2" stroke-linejoin="round"/><path d="M50 16 L72 19 M56 5 L68 7" stroke="#FFE07A" stroke-width="4" stroke-linecap="round"/><circle cx="63" cy="-7" r="5" fill="#FFE07A" stroke="#3E2F27" stroke-width="2"/></g>';
    case 'crown': return '<g class="hat"><path d="M40 29 L42 9 L51 20 L60 4 L69 20 L78 9 L80 29 Z" fill="#F4C25B" stroke="#8A5A14" stroke-width="2" stroke-linejoin="round"/><circle cx="60" cy="22" r="3.2" fill="#E2574C"/><circle cx="49" cy="25" r="2.3" fill="#3B7FC4"/><circle cx="71" cy="25" r="2.3" fill="#3F8B5C"/></g>';
    case 'wizard': return '<g class="hat"><path d="M40 30 Q60 35 80 30 L58 -16 Z" fill="#6C4BB4" stroke="#3A2470" stroke-width="2" stroke-linejoin="round"/><ellipse cx="60" cy="30" rx="27" ry="6" fill="#6C4BB4" stroke="#3A2470" stroke-width="2"/><path d="M60 4l1.6 3.4 3.6.4-2.7 2.4.8 3.6-3.3-1.8-3.3 1.8.8-3.6-2.7-2.4 3.6-.4z" fill="#FFE07A"/><circle cx="52" cy="20" r="1.6" fill="#FFE07A"/><circle cx="67" cy="17" r="1.3" fill="#FFE07A"/></g>';
    case 'eyepatch': return '<g class="hat"><path d="M37 38 Q60 30 85 44" stroke="#222" stroke-width="2.4" fill="none"/><ellipse cx="71.5" cy="52" rx="7.5" ry="6.5" fill="#222"/></g>';
  }
  return '';
}
function bonnieSVG(hat) {
  return `<svg viewBox="0 0 120 124" aria-hidden="true">
    <g class="tail"><path d="M86 100 q20 -4 20 -24" fill="none" stroke="var(--fur-dk)" stroke-width="10" stroke-linecap="round"/><g fill="var(--fur-dk)">${curls(106, 74, 5, 5, 5)}</g></g>
    <g fill="var(--fur)"><ellipse cx="60" cy="102" rx="31" ry="19"/>${curls(60, 102, 22, 12, 7)}</g>
    <g fill="var(--fur-lt)" opacity=".55">${curls(60, 104, 10, 6, 4)}</g>
    <g class="head">
      <g fill="var(--fur-dk)">${ear(33, -1)}${ear(87, 1)}</g>
      <g fill="var(--fur)"><circle cx="60" cy="52" r="25"/>${curls(60, 50, 23, 14, 7.5)}</g>
      <g fill="var(--fur-lt)" opacity=".6">${curls(60, 30, 7, 6, 4.5)}</g>
      <ellipse cx="60" cy="66" rx="16" ry="12.5" fill="var(--fur-lt)"/>
      <g class="eyes"><circle cx="48.5" cy="52" r="4.2" fill="#24160e"/><circle cx="71.5" cy="52" r="4.2" fill="#24160e"/><circle cx="50" cy="50.4" r="1.4" fill="#fff"/><circle cx="73" cy="50.4" r="1.4" fill="#fff"/></g>
      <ellipse cx="60" cy="75" rx="4.6" ry="6.5" fill="#ef7b8f"/>
      <ellipse cx="60" cy="61" rx="5.8" ry="4.2" fill="#24160e"/><ellipse cx="58.2" cy="59.8" rx="1.6" ry="1" fill="#6b5446"/>
      <path d="M60 65.2v4M52.5 68.6q7.5 5.4 15 0" stroke="#24160e" stroke-width="2" fill="none" stroke-linecap="round"/>
      ${hatSVG(hat)}
    </g>
  </svg>`;
}

/* ---------- sound & speech ---------- */
let AC = null;
function tone(f, d = .1, type = 'sine', vol = .15, delay = 0) {
  if (!soundOn) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { return; }
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
const giggle = () => [800, 1000, 850, 1100, 900].forEach((f, i) => tone(f, .07, 'sine', .12, i * .08));
const coinUp = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .12, 'square', .06, i * .06));
let VOICE = null, utter = null;
function pickVoice() { const vs = speechSynthesis.getVoices(), gb = vs.filter(v => /en[-_]GB/i.test(v.lang));
  VOICE = gb.find(v => /Serena|Kate|Martha|Stephanie|Libby|Sonia|Female/i.test(v.name)) || gb[0] || null; }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, pitch = 1.1) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel(); utter = new SpeechSynthesisUtterance(text); utter.lang = 'en-GB'; if (VOICE) utter.voice = VOICE; utter.rate = .92; utter.pitch = pitch; speechSynthesis.speak(utter);
}
function hearts(el, emoji = '💖', n = 4) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < n; i++) { const h = document.createElement('div'); h.className = 'heart'; h.textContent = emoji;
    h.style.left = (r.left + r.width * (.2 + Math.random() * .6)) + 'px'; h.style.top = (r.top + r.height * .2) + 'px'; h.style.animationDelay = (i * .12) + 's';
    document.body.appendChild(h); setTimeout(() => h.remove(), 1600); }
}

/* ---------- render ---------- */
function progressFor(game) {
  try {
    if (game.progress === 'words') {
      const p = JSON.parse(localStorage.getItem('meadowWords_english_v1') || 'null');
      const n = p ? Object.values(p).reduce((a, w) => a + (w.stars || []).reduce((x, y) => x + y, 0), 0) : 0;
      return `⭐ ${n} of 60 stars`;
    }
    if (game.progress === 'maths') {
      const r = S.raw, n = ['done', 'done2', 'done3', 'done4'].reduce((a, k) => a + Object.values(r[k] || {}).filter(Boolean).length, 0);
      return `✔ ${n} level${n === 1 ? '' : 's'} done`;
    }
  } catch (e) {}
  return '';
}
function render() {
  S = loadShared();
  const name = S.childName, title = S.hasName ? `${name}'s Meadow Clubhouse` : 'Meadow Clubhouse';
  document.body.dataset.theme = S.theme;
  document.title = title;
  document.getElementById('title').textContent = title;
  // no name yet (or changing it): show the name card instead of the games
  const asking = !S.hasName || editingName;
  document.getElementById('nameCard').hidden = !asking;
  document.getElementById('cabinets').hidden = asking;
  document.getElementById('changeName').hidden = asking || !S.hasName;
  document.getElementById('nameCancel').hidden = !S.hasName;
  document.getElementById('nameLabel').textContent = S.hasName ? 'What’s your new name?' : 'What’s your name?';
  document.getElementById('boneNum').textContent = S.bones;
  document.getElementById('bonnie').innerHTML = bonnieSVG(S.hat);
  document.getElementById('soundBtn').textContent = soundOn ? '🔊 Sound: on' : '🔇 Sound: off';
  document.getElementById('cabinets').innerHTML = CONFIG.GAMES.map(g => {
    const prog = progressFor(g);
    const inner = `
      <div class="marquee" style="background:${g.color}">${esc(g.name)}<small>${esc(g.sub)}</small></div>
      <div class="screen" style="background:${g.screen}">
        ${g.bits.map(([e, x, y], i) => `<span class="bit" style="left:${x}%;top:${y}%;animation-delay:${-i * .6}s">${e}</span>`).join('')}
        <span class="big" style="left:${g.big[1]}%;top:${g.big[2]}%">${esc(g.big[0])}</span>
      </div>
      <div class="about">${esc(g.about)}</div>
      ${prog ? `<div class="stats">${prog}</div>` : ''}
      <div class="play" style="background:${g.color};box-shadow:0 6px 0 ${g.dark}">${g.soon ? 'Coming soon' : '▶ PLAY'}</div>`;
    return g.soon || !g.href ? `<div class="cab soon">${inner}</div>`
                             : `<a class="cab" href="${esc(g.href)}" data-name="${esc(g.name)}">${inner}</a>`;
  }).join('');
  document.querySelectorAll('a.cab').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); coinUp(); say(`Let's play ${a.dataset.name}!`);
    setTimeout(() => { location.href = a.getAttribute('href'); }, 650);
  }));
}
function greet() {
  if (!S.hasName || editingName) {
    const t = S.hasName ? 'Ooh, a new name? Type it in the box!' : "Woof! I'm Bonnie. Welcome to the Meadow Clubhouse! What's your name?";
    document.getElementById('say').textContent = t; return t;
  }
  const n = S.childName;
  const lines = S.bones > 0
    ? [`Welcome back, ${n}! You've got ${S.bones} bones in the bowl. Which game shall we play?`, `Woof! Hi ${n}! Pick a game and let's earn more bones!`]
    : [`Hello ${n}! Welcome to the Meadow Clubhouse! Pick a game to start earning bones.`, `Woof! Hi ${n}! Shall we play some maths or some words today?`];
  const t = rand(lines); document.getElementById('say').textContent = t; return t;
}
const TICKLES = ['Hee hee! That tickles!', 'Ha ha! Stop it, {N}!', 'Woof woof! Giggle!', 'Ooh, my ears are ticklish!'];

/* ---------- the player's name (used by every game) ---------- */
let editingName = false;
function saveName(v) {
  const raw = readRaw(); raw.name = v; // keep everything else the games have saved
  try { localStorage.setItem(CONFIG.SHARED_KEY, JSON.stringify(raw)); } catch (e) {}
}
function openNameCard() {
  editingName = true; render(); greet();
  const inp = document.getElementById('nameIn'); inp.value = S.childName; document.getElementById('nameMsg').textContent = '';
  inp.focus();
}
document.getElementById('nameCard').addEventListener('submit', e => {
  e.preventDefault();
  const v = document.getElementById('nameIn').value.trim().replace(/\s+/g, ' ').slice(0, 16);
  if (!v) { document.getElementById('nameMsg').textContent = 'Type your name first! 🐾'; document.getElementById('nameIn').focus(); return; }
  saveName(v); editingName = false; render(); coinUp();
  const t = `Hi ${v}! Welcome to your Meadow Clubhouse! Pick a game to play.`;
  document.getElementById('say').textContent = t; say(t);
});
document.getElementById('nameCancel').addEventListener('click', () => { editingName = false; render(); greet(); });
document.getElementById('changeName').addEventListener('click', openNameCard);

render();
const firstLine = greet();
if (!S.hasName) setTimeout(() => document.getElementById('nameIn').focus(), 100);
// Browsers only allow speech after the first tap, so Bonnie says hello then (unless the tap was on Bonnie or a game).
document.addEventListener('pointerdown', e => { if (!e.target.closest('#bonnie, a.cab, #soundBtn, #nameCard, #changeName')) say(document.getElementById('say').textContent); }, { once: true });
document.getElementById('bonnie').addEventListener('click', e => {
  const b = e.currentTarget; b.classList.remove('giggle'); void b.offsetWidth; b.classList.add('giggle');
  giggle(); hearts(b);
  const t = rand(TICKLES).replace('{N}', S.childName); document.getElementById('say').textContent = t; say(t, 1.4);
});
document.getElementById('frog').addEventListener('click', e => {
  const f = e.currentTarget; f.classList.remove('boing'); void f.offsetWidth; f.classList.add('boing');
  tone(180, .08, 'sawtooth', .08); tone(160, .12, 'sawtooth', .08, .1); hearts(f, '💚', 2);
});
document.getElementById('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn; try { localStorage.setItem('meadowClubhouse_sound', soundOn ? '1' : '0'); } catch (e) {}
  if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  render(); if (soundOn) say(firstLine);
});
// keep the bone count fresh when coming back from a game or another tab
window.addEventListener('storage', e => { if (e.key === CONFIG.SHARED_KEY) { const old = S.bones; render(); if (S.bones !== old) document.getElementById('boneChip').classList.add('bump'); } });
window.addEventListener('pageshow', e => { if (e.persisted) { render(); greet(); } });
</script>
</body>
</html>
